<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – İsmail Coşar Turizm</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1F3A}
.login-box{background:#fff;border-radius:12px;padding:40px;width:360px;text-align:center}
.login-box h1{color:#0B1F3A;margin-bottom:8px;font-size:22px}
.login-box p{color:#666;font-size:14px;margin-bottom:24px}
.login-box input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px;outline:none}
.login-box button{width:100%;padding:12px;background:#C9972B;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.err{color:red;font-size:13px;margin-top:10px;display:none}
.app{display:none;min-height:100vh}
.sidebar{width:220px;background:#0B1F3A;min-height:100vh;padding:20px 0;position:fixed;top:0;left:0}
.sidebar-logo{text-align:center;padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
.sidebar-logo img{height:40px;width:auto}
.nav-item{display:block;padding:12px 20px;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover,.nav-item.active{background:rgba(201,151,43,.15);color:#E4B84A}
.main{margin-left:220px;padding:24px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.header h2{color:#0B1F3A;font-size:20px}
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn-gold{background:#C9972B;color:#fff}
.btn-red{background:#dc3545;color:#fff}
.btn-navy{background:#0B1F3A;color:#fff}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{color:#0B1F3A;margin-bottom:16px;font-size:16px;border-bottom:1px solid #eee;padding-bottom:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:4px;text-transform:uppercase}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none}
.tur-list{display:flex;flex-direction:column;gap:10px}
.tur-item{background:#f8f9fa;border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tur-item-info h4{font-size:14px;color:#0B1F3A;margin-bottom:4px}
.tur-item-info p{font-size:12px;color:#666}
.tur-item-actions{display:flex;gap:8px}
.badge{font-size:11px;padding:3px 8px;border-radius:50px;font-weight:600}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-red{background:#ffebee;color:#c62828}
.fiyat-tablo{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.fiyat-tablo th,.fiyat-tablo td{padding:8px 12px;border:1px solid #eee;text-align:left}
.fiyat-tablo th{background:#f8f9fa;font-weight:600;color:#0B1F3A}
.fiyat-tablo input{border:none;background:transparent;width:100%;font-size:13px;outline:none;text-align:center}
.fiyat-tablo input:focus{background:#fff3e0;border-radius:4px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;font-weight:600;z-index:9999;display:none}
.toast-success{background:#2e7d32}
.toast-error{background:#c62828}
.loading{text-align:center;padding:40px;color:#666}
</style>
</head>
<body>

<div class="login" id="loginDiv">
  <div class="login-box">
    <h1>🔐 Admin Paneli</h1>
    <p>İsmail Coşar Turizm</p>
    <input type="email" id="uname" placeholder="E-posta" autocomplete="username">
    <input type="password" id="upass" placeholder="Şifre" autocomplete="current-password">
    <button onclick="girisYap()" id="girisBtn">Giriş Yap</button>
    <div class="err" id="loginErr">E-posta veya şifre yanlış!</div>
  </div>
</div>

<div class="app" id="appDiv">
  <div class="sidebar">
    <div class="sidebar-logo"><img src="logo.png" alt="Logo"></div>
    <button class="nav-item" id="btn-basvuru" onclick="sekmeAc('basvuru')">📥 Başvurular <span id="yeniSayac" style="display:none;background:#dc3545;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:50px;margin-left:4px"></span></button>
    <button class="nav-item active" id="btn-turlar" onclick="sekmeAc('turlar')">📋 Tur Listesi</button>
    <button class="nav-item" id="btn-ekle" onclick="sekmeAc('ekle')">➕ Tur Ekle</button>
    <button class="nav-item" id="btn-fiyat" onclick="sekmeAc('fiyat')">💲 Fiyat Tabloları</button>
    <button class="nav-item" id="btn-sezon" onclick="sekmeAc('sezon')">🌙 Sezon Programları</button>
    <button class="nav-item" id="btn-duyuru" onclick="sekmeAc('duyuru')">📢 Duyurular</button>
    <button class="nav-item" onclick="cikisYap()" style="color:rgba(255,100,100,.7);margin-top:20px">🚪 Çıkış</button>
  </div>
  <div class="main">
    <div id="sayfa-basvuru" style="display:none"></div>
    <div id="sayfa-turlar"></div>
    <div id="sayfa-ekle" style="display:none"></div>
    <div id="sayfa-fiyat" style="display:none"></div>
  <div id="sayfa-sezon" style="display:none"></div>
  <div id="sayfa-duyuru" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const sb = supabase.createClient('https://wpkjxwbvewwgdclbsdya.supabase.co', 'sb_publishable_bEXKjIeKKN4JrMkOPy3LQg_ZuSlEQNK');

function paneliAc() {
  document.getElementById('loginDiv').style.display = 'none';
  document.getElementById('appDiv').style.display = 'flex';
  sekmeAc('basvuru');
}

window.onload = async () => {
  document.getElementById('appDiv').style.display = 'none';
  document.getElementById('loginDiv').style.display = 'flex';
  const { data } = await sb.auth.getSession();
  if (data && data.session) paneliAc();
};

document.querySelectorAll('#loginDiv input').forEach(i => {
  i.addEventListener('keydown', e => { if(e.key==='Enter') girisYap(); });
});

async function girisYap() {
  const email = document.getElementById('uname').value.trim();
  const password = document.getElementById('upass').value;
  const btn = document.getElementById('girisBtn');
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Giriş Yap';
  if (!error) {
    document.getElementById('upass').value = '';
    paneliAc();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    setTimeout(() => document.getElementById('loginErr').style.display = 'none', 3000);
  }
}

async function cikisYap() {
  await sb.auth.signOut();
  document.getElementById('loginDiv').style.display = 'flex';
  document.getElementById('appDiv').style.display = 'none';
}

function sekmeAc(ad) {
  ['basvuru','turlar','ekle','fiyat','sezon','duyuru'].forEach(s => {
    document.getElementById('sayfa-' + s).style.display = s === ad ? 'block' : 'none';
    const btn = document.getElementById('btn-' + s);
    if (btn) btn.classList.toggle('active', s === ad);
  });
  if (ad === 'basvuru') renderBasvurular();
  if (ad === 'turlar') renderTurlar();
  if (ad === 'ekle') renderEkle();
  if (ad === 'fiyat') renderFiyat();
  if (ad === 'sezon') renderSezon();
  if (ad === 'duyuru') renderDuyuru();
}

// ── TUR LİSTESİ ──
async function renderTurlar() {
  const el = document.getElementById('sayfa-turlar');
  el.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
  const { data, error } = await sb.from('turlar').select('*').order('kategori').order('tarih');
  if (error) { el.innerHTML = '<div class="loading">❌ ' + error.message + '</div>'; return; }
  const katMap = {hac:'🕋 Hac', umre:'🌙 Umre', diger:'✈️ Diğer'};
  el.innerHTML = '<div class="header"><h2>📋 Tur Listesi (' + data.length + ' tur)</h2></div>' +
    '<div class="card"><div class="tur-list">' +
    data.map(t => `
      <div class="tur-item">
        <div class="tur-item-info">
          <h4>${t.icon} ${t.baslik}</h4>
          <p>${katMap[t.kategori]||t.kategori} · ${t.tarih}${t.donus_tarihi?' → '+t.donus_tarihi:''} · ${t.fiyat} ${t.para_birimi}</p>
          <p style="font-size:11px;color:#999;margin-top:2px">ID: ${t.id}</p>
        </div>
        <div class="tur-item-actions">
          <span class="badge ${t.aktif?'badge-green':'badge-red'}">${t.aktif?'Aktif':'Pasif'}</span>
          <a class="btn btn-navy" href="tur-detay.html?id=${t.id}" target="_blank" style="text-decoration:none">Detay</a>
          <button class="btn btn-navy" onclick="turDuzenle('${t.id}')">Düzenle</button>
          <button class="btn btn-red" onclick="turSil('${t.id}')">Sil</button>
        </div>
      </div>`).join('') +
    '</div></div>';
}

async function turSil(id) {
  if (!confirm('Bu turu silmek istediğinizden emin misiniz?')) return;
  const { error } = await sb.from('turlar').delete().eq('id', id);
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Tur silindi', 'success');
  renderTurlar();
}

async function turDuzenle(id) {
  const { data } = await sb.from('turlar').select('*').eq('id', id).single();
  if (!data) return;
  const el = document.getElementById('sayfa-turlar');
  el.innerHTML = `
    <div class="header"><h2>✏️ Tur Düzenle</h2></div>
    <div class="card">
      <div class="form-row">
        <div class="form-group"><label>Başlık</label><input id="e_baslik" value="${data.baslik}"></div>
        <div class="form-group"><label>Kategori</label>
          <select id="e_kategori">
            <option value="hac" ${data.kategori==='hac'?'selected':''}>Hac</option>
            <option value="umre" ${data.kategori==='umre'?'selected':''}>Umre</option>
            <option value="diger" ${data.kategori==='diger'?'selected':''}>Diğer</option>
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Kişi Başı Fiyat (Umre'de gösterilmez)</label><input id="e_fiyat" value="${data.fiyat}"></div>
        <div class="form-group"><label>Para Birimi</label>
          <select id="e_pb">
            <option value="₺" ${data.para_birimi==='₺'?'selected':''}>₺ TL</option>
            <option value="$" ${data.para_birimi==='$'?'selected':''}>$ USD</option>
            <option value="€" ${data.para_birimi==='€'?'selected':''}>€ EUR</option>
          </select></div>
      </div>
      <div class="form-row" style="grid-template-columns:1fr 1fr 1fr">
        <div class="form-group"><label>2 Kişilik Oda (kişi başı)</label><input id="e_fiyat_2" value="${data.fiyat_2||''}" placeholder="Boş bırakılabilir"></div>
        <div class="form-group"><label>3 Kişilik Oda (kişi başı)</label><input id="e_fiyat_3" value="${data.fiyat_3||''}" placeholder="Boş bırakılabilir"></div>
        <div class="form-group"><label>4 Kişilik Oda (kişi başı)</label><input id="e_fiyat_4" value="${data.fiyat_4||''}" placeholder="Boş bırakılabilir"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Gidiş Tarihi</label><input id="e_tarih" type="date" value="${data.tarih}"></div>
        <div class="form-group"><label>Dönüş Tarihi</label><input id="e_donus" type="date" value="${data.donus_tarihi||''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Süre</label><input id="e_sure" value="${data.sure}"></div>
        <div class="form-group"><label>Kapasite</label><input id="e_kapasite" value="${data.kapasite||''}"></div>
      </div>
      <div class="form-group"><label>Konum</label><input id="e_konum" value="${data.konum}"></div>
      <div class="form-group"><label>Otel</label><input id="e_otel" value="${(data.otel||'').replace(/"/g,'&quot;')}" placeholder="Örn: Mekke – Swissôtel / Medine – Pullman Zamzam"></div>
      <div class="form-row">
        <div class="form-group"><label>Kontenjan</label>
          <select id="e_kontenjan">
            <option value="var" ${data.kontenjan==='var'?'selected':''}>Yer Var</option>
            <option value="az" ${data.kontenjan==='az'?'selected':''}>Az Kaldı</option>
            <option value="dolu" ${data.kontenjan==='dolu'?'selected':''}>Dolu</option>
          </select></div>
        <div class="form-group"><label>Durum</label>
          <select id="e_aktif">
            <option value="true" ${data.aktif?'selected':''}>Aktif</option>
            <option value="false" ${!data.aktif?'selected':''}>Pasif</option>
          </select></div>
      </div>
      <div class="form-group"><label>Açıklama</label><textarea id="e_aciklama" rows="3" style="width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none;resize:vertical">${data.aciklama||''}</textarea></div>
      <div class="form-group"><label>Sezon (Umre için)</label><input id="e_sezon" value="${data.sezon||''}"></div>
      <div class="form-group"><label>Program (Gün Gün)</label><textarea id="e_program" rows="8" style="width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none;resize:vertical">${data.program||''}</textarea></div>
      <div class="form-group"><label>Dahil Olanlar (her satıra bir madde)</label><textarea id="e_dahil" rows="5" style="width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none;resize:vertical">${data.dahil||''}</textarea></div>
      <div class="form-group"><label>Dahil Olmayanlar</label><textarea id="e_dahil_degil" rows="5" style="width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none;resize:vertical">${data.dahil_degil||''}</textarea></div>
      <div class="form-group"><label>Notlar</label><textarea id="e_notlar" rows="3" style="width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none;resize:vertical">${data.notlar||''}</textarea></div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-gold" onclick="turKaydet('${id}')">💾 Kaydet</button>
        <button class="btn btn-navy" onclick="renderTurlar()">İptal</button>
      </div>
    </div>`;
}

async function turKaydet(id) {
  const { error } = await sb.from('turlar').update({
    baslik: document.getElementById('e_baslik').value,
    kategori: document.getElementById('e_kategori').value,
    fiyat: document.getElementById('e_fiyat').value,
    para_birimi: document.getElementById('e_pb').value,
    tarih: document.getElementById('e_tarih').value,
    donus_tarihi: document.getElementById('e_donus').value || null,
    fiyat_2: document.getElementById('e_fiyat_2').value.trim(),
    fiyat_3: document.getElementById('e_fiyat_3').value.trim(),
    fiyat_4: document.getElementById('e_fiyat_4').value.trim(),
    sure: document.getElementById('e_sure').value,
    konum: document.getElementById('e_konum').value,
    otel: document.getElementById('e_otel').value.trim(),
    kapasite: document.getElementById('e_kapasite').value,
    kontenjan: document.getElementById('e_kontenjan').value,
    aktif: document.getElementById('e_aktif').value === 'true',
    aciklama: document.getElementById('e_aciklama').value,
    sezon: document.getElementById('e_sezon').value,
    program: document.getElementById('e_program').value,
    dahil: document.getElementById('e_dahil').value,
    dahil_degil: document.getElementById('e_dahil_degil').value,
    notlar: document.getElementById('e_notlar').value
  }).eq('id', id);
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Tur kaydedildi', 'success');
  renderTurlar();
}

// ── TUR EKLE ──
function renderEkle() {
  document.getElementById('sayfa-ekle').innerHTML = `
    <div class="header"><h2>➕ Yeni Tur Ekle</h2></div>
    <div class="card">
      <div class="form-row">
        <div class="form-group"><label>Başlık *</label><input id="n_baslik" placeholder="Tur adı"></div>
        <div class="form-group"><label>Kategori</label>
          <select id="n_kategori">
            <option value="hac">Hac</option>
            <option value="umre">Umre</option>
            <option value="diger">Diğer</option>
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Kişi Başı Fiyat (Umre'de gösterilmez)</label><input id="n_fiyat" placeholder="58.000"></div>
        <div class="form-group"><label>Para Birimi</label>
          <select id="n_pb"><option value="₺">₺ TL</option><option value="$">$ USD</option><option value="€">€ EUR</option></select></div>
      </div>
      <div class="form-row" style="grid-template-columns:1fr 1fr 1fr">
        <div class="form-group"><label>2 Kişilik Oda (kişi başı)</label><input id="n_fiyat_2" placeholder="Boş bırakılabilir"></div>
        <div class="form-group"><label>3 Kişilik Oda (kişi başı)</label><input id="n_fiyat_3" placeholder="Boş bırakılabilir"></div>
        <div class="form-group"><label>4 Kişilik Oda (kişi başı)</label><input id="n_fiyat_4" placeholder="Boş bırakılabilir"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Gidiş Tarihi</label><input id="n_tarih" type="date"></div>
        <div class="form-group"><label>Dönüş Tarihi</label><input id="n_donus" type="date"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Süre</label><input id="n_sure" placeholder="10 gece"></div>
        <div class="form-group"><label>Kapasite</label><input id="n_kapasite" placeholder="40 kişi"></div>
      </div>
      <div class="form-group"><label>Konum</label><input id="n_konum" placeholder="Mekke & Medine"></div>
      <div class="form-group"><label>Otel</label><input id="n_otel" placeholder="Örn: Mekke – Swissôtel / Medine – Pullman Zamzam"></div>
      <div class="form-group"><label>Açıklama</label><textarea id="n_aciklama" rows="3" placeholder="Kısa açıklama" style="width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none;resize:vertical"></textarea></div>
      <div class="form-group"><label>Sezon (Umre için)</label><input id="n_sezon" placeholder="Ramazan, Kış, Yaz"></div>
      <button class="btn btn-gold" onclick="turEkle()" style="margin-top:8px">➕ Tur Ekle</button>
    </div>`;
}

async function turEkle() {
  const baslik = document.getElementById('n_baslik').value.trim();
  if (!baslik) { toast('Başlık zorunlu!', 'error'); return; }
  const kat = document.getElementById('n_kategori').value;
  const icons = {hac:'🕋', umre:'🌙', diger:'✈️'};
  const { error } = await sb.from('turlar').insert({
    id: 'tur-' + Date.now(),
    kategori: kat,
    baslik: baslik,
    icon: icons[kat]||'✈️',
    tarih: document.getElementById('n_tarih').value,
    donus_tarihi: document.getElementById('n_donus').value || null,
    fiyat_2: document.getElementById('n_fiyat_2').value.trim(),
    fiyat_3: document.getElementById('n_fiyat_3').value.trim(),
    fiyat_4: document.getElementById('n_fiyat_4').value.trim(),
    sure: document.getElementById('n_sure').value,
    konum: document.getElementById('n_konum').value,
    otel: document.getElementById('n_otel').value.trim(),
    kapasite: document.getElementById('n_kapasite').value,
    fiyat: document.getElementById('n_fiyat').value,
    para_birimi: document.getElementById('n_pb').value,
    kontenjan: 'var',
    aktif: true,
    aciklama: document.getElementById('n_aciklama').value,
    sezon: document.getElementById('n_sezon').value
  });
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Tur eklendi!', 'success');
  renderEkle();
}

// ── FİYAT TABLOLARI ──
async function renderFiyat() {
  const el = document.getElementById('sayfa-fiyat');
  el.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
  let html = '<div class="header"><h2>💲 Fiyat Tabloları</h2></div>';
  
  for (const tip of ['hac','umre']) {
    const { data } = await sb.from('fiyat_tablolari').select('*').eq('tip',tip).order('sira');
    html += `<div class="card"><h3>${tip==='hac'?'🕋 Hac':'🌙 Umre'} Fiyat Tablosu</h3>
      <table class="fiyat-tablo">
        <thead><tr><th>Grup Adı</th><th>Süre</th><th>2 Kişilik ($)</th><th>3 Kişilik ($)</th><th>4 Kişilik ($)</th><th></th></tr></thead>
        <tbody>
        ${(data||[]).map(f => `
          <tr>
            <td><input id="fg_${f.id}" value="${f.grup||''}"></td>
            <td><input id="fs_${f.id}" value="${f.sure||''}"></td>
            <td><input id="f2_${f.id}" value="${f.fiyat_2||''}"></td>
            <td><input id="f3_${f.id}" value="${f.fiyat_3||''}"></td>
            <td><input id="f4_${f.id}" value="${f.fiyat_4||''}"></td>
            <td><button class="btn btn-red" style="padding:4px 8px;font-size:11px" onclick="fiyatSatirSil(${f.id})">Sil</button>
                <button class="btn btn-navy" style="padding:4px 8px;font-size:11px" onclick="fiyatSatirKaydet(${f.id})">💾</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <button class="btn btn-navy" style="margin-top:8px" onclick="fiyatSatirEkle('${tip}')">+ Satır Ekle</button>
    </div>`;
  }
  el.innerHTML = html;
}

async function fiyatSatirKaydet(id) {
  const { error } = await sb.from('fiyat_tablolari').update({
    grup: document.getElementById('fg_'+id).value,
    sure: document.getElementById('fs_'+id).value,
    fiyat_2: document.getElementById('f2_'+id).value,
    fiyat_3: document.getElementById('f3_'+id).value,
    fiyat_4: document.getElementById('f4_'+id).value
  }).eq('id', id);
  toast(error ? '❌ Hata' : '✅ Kaydedildi', error ? 'error' : 'success');
}

async function fiyatSatirSil(id) {
  await sb.from('fiyat_tablolari').delete().eq('id', id);
  toast('✅ Silindi', 'success');
  renderFiyat();
}

async function fiyatSatirEkle(tip) {
  const { data: mevcut } = await sb.from('fiyat_tablolari').select('sira').eq('tip',tip).order('sira',{ascending:false}).limit(1);
  const sira = mevcut && mevcut.length ? mevcut[0].sira + 1 : 0;
  await sb.from('fiyat_tablolari').insert({tip, grup:'', sure:'', fiyat_2:'', fiyat_3:'', fiyat_4:'', sira});
  renderFiyat();
}

// ── BAŞVURULAR ──
const DURUMLAR = {yeni:'🆕 Yeni', arandi:'📞 Arandı', kayit:'✅ Kayıt Oldu', iptal:'✖️ İlgilenmiyor'};
const DURUM_RENK = {yeni:'#dc3545', arandi:'#C9972B', kayit:'#2e7d32', iptal:'#999'};
const FORM_AD = {'umre-kayit':'Umre Kayıt', 'hac-kayit':'Hac Kayıt', 'tur-kayit':'Tur Kayıt', 'iletisim-formu':'İletişim Formu', 'ana-sayfa-iletisim':'Ana Sayfa Formu'};
let basvuruFiltre = 'hepsi';

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function yeniSayacGuncelle() {
  const { count } = await sb.from('basvurular').select('id', { count: 'exact', head: true }).eq('durum', 'yeni');
  const el = document.getElementById('yeniSayac');
  if (count) { el.textContent = count; el.style.display = 'inline-block'; } else el.style.display = 'none';
}

async function renderBasvurular() {
  const el = document.getElementById('sayfa-basvuru');
  el.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
  let q = sb.from('basvurular').select('*').order('created_at', { ascending: false }).limit(200);
  if (basvuruFiltre !== 'hepsi') q = q.eq('durum', basvuruFiltre);
  const { data, error } = await q;
  yeniSayacGuncelle();
  if (error) { el.innerHTML = '<div class="loading">❌ ' + esc(error.message) + '</div>'; return; }
  const filtreler = [['hepsi','Tümü'], ...Object.entries(DURUMLAR)];
  el.innerHTML = `
    <div class="header"><h2>📥 Başvurular</h2><button class="btn btn-navy" onclick="renderBasvurular()">↻ Yenile</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${filtreler.map(([k,v]) => `<button class="btn ${basvuruFiltre===k?'btn-navy':''}" style="${basvuruFiltre===k?'':'background:#fff;border:1px solid #ddd;color:#333'}" onclick="basvuruFiltre='${k}';renderBasvurular()">${v}</button>`).join('')}
    </div>
    ${!data.length ? '<div class="card" style="text-align:center;color:#888">Bu listede başvuru yok.</div>' : data.map(b => {
      const tel = (b.telefon||'').replace(/[^0-9+]/g,'');
      const wa = tel.replace(/^\+/,'').replace(/^0/,'90');
      const tarih = new Date(b.created_at).toLocaleString('tr-TR', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
      const ekstra = Object.entries(b.veri||{}).filter(([k]) => !['form-name','program','paket','tur','adsoyad','ad-soyad','ad','soyad','telefon','eposta','hizmet','kisi-sayisi','kisi','mesaj'].includes(k) && b.veri[k]);
      return `<div class="card" style="border-left:4px solid ${DURUM_RENK[b.durum]||'#ccc'}">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
          <div>
            <div style="font-size:12px;color:#888;margin-bottom:4px">${esc(tarih)} · ${esc(FORM_AD[b.form]||b.form||'Form')}</div>
            <div style="font-size:17px;font-weight:700;color:#0B1F3A">${esc(b.ad_soyad||'(isim yok)')}</div>
            ${b.program?`<div style="font-size:13.5px;color:#C9972B;font-weight:600;margin-top:2px">${esc(b.program)}</div>`:''}
          </div>
          <select onchange="basvuruDurum(${b.id}, this.value)" style="padding:7px 10px;border:1.5px solid #ddd;border-radius:6px;font-size:13px">
            ${Object.entries(DURUMLAR).map(([k,v]) => `<option value="${k}" ${b.durum===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:14px">
          ${tel?`<a href="tel:${esc(tel)}" style="color:#0B1F3A;font-weight:600;text-decoration:none">📞 ${esc(b.telefon)}</a><a href="https://wa.me/${esc(wa)}" target="_blank" style="color:#25D366;font-weight:600;text-decoration:none">💬 WhatsApp</a>`:''}
          ${b.eposta?`<a href="mailto:${esc(b.eposta)}" style="color:#0B1F3A;text-decoration:none">✉️ ${esc(b.eposta)}</a>`:''}
          ${b.hizmet?`<span>🏷 ${esc(b.hizmet)}</span>`:''}
          ${b.kisi_sayisi?`<span>👥 ${esc(b.kisi_sayisi)}${/^\d+$/.test(b.kisi_sayisi)?' kişi':''}</span>`:''}
          ${ekstra.map(([k,v]) => `<span>• ${esc(({'tercih-tarih':'Tercih edilen tarih'})[k]||k)}: ${esc(v)}</span>`).join('')}
        </div>
        ${b.mesaj?`<div style="margin-top:12px;padding:10px 12px;background:#f7f7f7;border-radius:8px;font-size:13.5px;white-space:pre-wrap">${esc(b.mesaj)}</div>`:''}
        <div style="margin-top:12px;text-align:right"><button class="btn btn-red" style="padding:6px 12px;font-size:12px" onclick="basvuruSil(${b.id})">Sil</button></div>
      </div>`;
    }).join('')}`;
}

async function basvuruDurum(id, durum) {
  const { error } = await sb.from('basvurular').update({ durum }).eq('id', id);
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Durum güncellendi', 'success');
  renderBasvurular();
}

async function basvuruSil(id) {
  if (!confirm('Bu başvuruyu kalıcı olarak silmek istediğinizden emin misiniz?')) return;
  const { error } = await sb.from('basvurular').delete().eq('id', id);
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Başvuru silindi', 'success');
  renderBasvurular();
}

function toast(msg, tip) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast toast-' + tip; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
