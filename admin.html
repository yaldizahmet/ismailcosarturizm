<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Admin – İsmail Coşar Turizm</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1F3A}
.login-box{background:#fff;border-radius:12px;padding:40px;width:360px;text-align:center}
.login-box h1{color:#0B1F3A;margin-bottom:8px;font-size:22px}
.login-box p{color:#666;font-size:14px;margin-bottom:24px}
.login-box input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px;outline:none}
.login-box button{width:100%;padding:12px;background:#C9972B;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.err{color:red;font-size:13px;margin-top:10px;display:none}
.app{display:none;min-height:100vh}
.sidebar{width:220px;background:#0B1F3A;min-height:100vh;padding:20px 0;position:fixed;top:0;left:0}
.sidebar-logo{text-align:center;padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
.sidebar-logo img{height:40px;width:auto}
.nav-item{display:block;padding:12px 20px;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
body.rol-rehber .yonetici{display:none!important}
.rehber-paylas{text-align:center;display:block}
.kullanici-serit{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin:-8px 0 12px;font-size:13px;color:#555}
#kullaniciBilgi{background:#fff;border:1px solid #e6e0cf;border-radius:20px;padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
.kullanici-cikis{background:none;border:0;color:#c62828;font-size:13px;cursor:pointer;padding:4px}
.nav-baslik{padding:16px 20px 6px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(228,184,74,.8);font-weight:700}
.ana-kart h3{margin-bottom:12px}
.ana-btnler{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ana-btnler button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border:1px solid #eee;border-radius:10px;background:#fafafa;cursor:pointer;font-size:15px;font-weight:600;color:#0B1F3A}
.ana-btnler button:hover{border-color:#C9972B;background:#fff8ec}
.ana-btnler small{font-size:12px;font-weight:400;color:#777}
.ana-ikon{font-style:normal}
.nav-item:hover,.nav-item.active{background:rgba(201,151,43,.15);color:#E4B84A}
.main{margin-left:220px;padding:24px;min-height:100vh;flex:1;min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.header h2{color:#0B1F3A;font-size:20px}
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn-gold{background:#C9972B;color:#fff}
.btn-red{background:#dc3545;color:#fff}
.btn-navy{background:#0B1F3A;color:#fff}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{color:#0B1F3A;margin-bottom:16px;font-size:16px;border-bottom:1px solid #eee;padding-bottom:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:4px;text-transform:uppercase}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;outline:none}
.tur-list{display:flex;flex-direction:column;gap:10px}
.tur-item{background:#f8f9fa;border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tur-item-info h4{font-size:14px;color:#0B1F3A;margin-bottom:4px}
.tur-item-info p{font-size:12px;color:#666}
.tur-item-actions{display:flex;gap:8px}
.badge{font-size:11px;padding:3px 8px;border-radius:50px;font-weight:600}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-red{background:#ffebee;color:#c62828}
.fiyat-tablo{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.fiyat-tablo th,.fiyat-tablo td{padding:8px 12px;border:1px solid #eee;text-align:left}
.katilimci-tablo td,.katilimci-tablo th,.musteri-tablo td,.onizleme-tablo td{white-space:nowrap}
.fiyat-tablo th{background:#f8f9fa;font-weight:600;color:#0B1F3A}
.fiyat-tablo input{border:none;background:transparent;width:100%;font-size:13px;outline:none;text-align:center}
.fiyat-tablo input:focus{background:#fff3e0;border-radius:4px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;font-weight:600;z-index:9999;display:none}
.toast-success{background:#2e7d32}
.toast-error{background:#c62828}
.loading{text-align:center;padding:40px;color:#666}
.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;outline:none}
.mobil-yazi{display:none}
.mobil-ust{display:none;position:sticky;top:0;z-index:100;background:#0B1F3A;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mobil-ust img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 8px}
.mobil-ust span{color:#E4B84A;font-size:11px;letter-spacing:1.6px;font-weight:700;text-transform:uppercase}
.mobil-alt{display:none;position:fixed;left:0;right:0;bottom:0;z-index:200;background:#0B1F3A;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.mobil-alt button{flex:1;background:none;border:0;color:rgba(255,255,255,.65);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:54px;cursor:pointer;position:relative;border-radius:10px}
.mobil-alt button b{font-size:21px;font-weight:400;line-height:1}
.mobil-alt button.active{color:#E4B84A;background:rgba(201,151,43,.14)}
.mobil-alt .rozet{position:absolute;top:2px;left:calc(50% + 6px);background:#dc3545;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:50px}
.mobil-perde{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end}
.mobil-perde[hidden]{display:none}
.mobil-sayfa{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.mobil-sayfa .tutamak{width:40px;height:4px;border-radius:2px;background:#ccd;margin:4px auto 12px}
.mobil-sayfa button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid #f0f0f0;padding:15px 6px;font-size:16px;color:#0B1F3A;text-align:left;cursor:pointer}
.mobil-sayfa button:last-child{border-bottom:0}
/* TELEFON VE TABLET: menü üstte yatay şerit, formlar tek sütun */
@media (max-width: 820px) {
  .app{flex-direction:column}
  .sidebar{position:sticky;top:0;width:100%;min-height:0;padding:0;display:flex;align-items:stretch;overflow-x:auto;-webkit-overflow-scrolling:touch;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .sidebar-logo{display:none}
  .nav-item{width:auto;flex:none;white-space:nowrap;padding:15px 14px;font-size:14px;margin-top:0!important;border-bottom:3px solid transparent}
  .nav-item.active{border-bottom-color:#C9972B}
  .nav-baslik{display:flex;align-items:center;flex:none;white-space:nowrap;padding:0 4px 0 14px;font-size:9.5px;border-left:1px solid rgba(255,255,255,.15)}
  .main{margin-left:0;padding:14px 12px 40px;min-width:0}
  .header{flex-wrap:wrap;gap:10px}
  .header h2{font-size:18px}
  .card{padding:14px;overflow-x:auto}
  .form-row,.form-row[style]{grid-template-columns:1fr!important}
  .form-group input,.form-group select,.form-group textarea,.prog-satir input{font-size:16px}
  .tur-item{flex-direction:column;align-items:stretch}
  .tur-item-actions{flex-wrap:wrap}
  .tur-item-actions .btn{flex:1 1 auto;min-height:40px}
  .prog-satir[style]{grid-template-columns:1fr 1fr!important;padding:10px;border:1px solid #eee;border-radius:8px}
  .prog-satir .p_baslik,.prog-satir .p_yer,.prog-satir .p_konum,.prog-satir .btn{grid-column:1/-1;min-height:40px}
  .prog-satir .btn-red{background:#fff;color:#c62828;border:1.5px solid #f3c2c2}
  .mobil-yazi{display:inline}
  .login-box{width:calc(100% - 32px);padding:28px 20px}
  .toast{left:12px;right:12px;bottom:12px;text-align:center}
  .form-group[style*="max-width"]{max-width:none!important}
  /* Uygulama görünümü: üstte marka çubuğu, altta sekme çubuğu (misafir uygulaması gibi) */
  body{background:#eef1f5}
  .sidebar{display:none}
  .mobil-ust{display:flex}
  .mobil-alt{display:flex}
  body.rol-rehber .mobil-alt{display:none!important}
  .main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
  body.rol-rehber .main{padding-bottom:40px}
  .kullanici-serit{margin:0 0 10px}
  .card{border-radius:16px;box-shadow:0 1px 4px rgba(11,31,58,.08)}
  .btn{min-height:42px;border-radius:10px;font-size:14px}
  .ana-btnler{grid-template-columns:1fr 1fr;gap:10px}
  .ana-btnler button{align-items:center;text-align:center;justify-content:center;min-height:104px;padding:14px 8px;border-radius:14px;background:#fff;border:1px solid #e8ebf0;font-size:15px;box-shadow:0 1px 3px rgba(11,31,58,.06)}
  .ana-kart{background:none;box-shadow:none;padding:0;overflow:visible}
  .ana-ikon{display:block;font-style:normal;font-size:30px;margin-bottom:6px}
  .ana-btnler small{font-size:12px;line-height:1.35}
  .ana-kart h3{border:0;padding:4px 2px 0;margin-bottom:10px;font-size:15px}
  .dogum-kart{background:#fff;padding:14px;box-shadow:0 1px 4px rgba(11,31,58,.08)}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<div class="login" id="loginDiv">
  <div class="login-box">
    <h1>🔐 Admin Paneli</h1>
    <p>İsmail Coşar Turizm</p>
    <input type="text" id="uname" placeholder="E-posta ya da kullanıcı adı" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input type="password" id="upass" placeholder="Şifre" autocomplete="current-password">
    <button onclick="girisYap()" id="girisBtn">Giriş Yap</button>
    <div class="err" id="loginErr">Kullanıcı adı / e-posta veya şifre yanlış!</div>
  </div>
</div>

<div class="app" id="appDiv">
  <header class="mobil-ust"><img src="kafile/logo.png" alt="İsmail Coşar Turizm"><span>Yönetim</span></header>
  <nav class="mobil-alt" aria-label="Menü">
    <button type="button" data-m="ana" onclick="sekmeAc('ana')"><b>🏠</b>Ana Sayfa</button>
    <button type="button" data-m="kafile" onclick="sekmeAc('kafile')"><b>🧳</b>Gruplar</button>
    <button type="button" data-m="musteri" onclick="sekmeAc('musteri')"><b>🧑‍🤝‍🧑</b>Müşteriler</button>
    <button type="button" data-m="basvuru" onclick="sekmeAc('basvuru')"><b>📥</b>Başvurular<span class="rozet" id="mobilSayac" hidden></span></button>
    <button type="button" data-m="diger" onclick="document.getElementById('mobilDiger').hidden=false"><b id="mobilDigerIkon">☰</b><span id="mobilDigerAd">Diğer</span></button>
  </nav>
  <div class="mobil-perde" id="mobilDiger" hidden onclick="if(event.target===this)this.hidden=true">
    <div class="mobil-sayfa"><div class="tutamak"></div>
      <button type="button" onclick="mobilGit('rehber')">🧭 Rehber Hesapları</button>
      <button type="button" onclick="mobilGit('sehir')">🗺️ Şehir Rehberi</button>
      <button type="button" onclick="mobilGit('turlar')">📋 Tur Listesi</button>
      <button type="button" onclick="mobilGit('duyuru')">📢 Duyurular</button>
      <button type="button" onclick="mobilGit('yorum')">💬 Yorumlar</button>
      <button type="button" onclick="document.getElementById('mobilDiger').hidden=true;cikisYap()" style="color:#c62828">🚪 Çıkış</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-logo"><img src="logo.png" alt="Logo"></div>
    <button class="nav-item yonetici active" id="btn-ana" onclick="sekmeAc('ana')">🏠 Ana Sayfa</button>
    <div class="nav-baslik yonetici">Grup Yönetimi</div>
    <button class="nav-item" id="btn-kafile" onclick="sekmeAc('kafile')">🧳 Gruplar</button>
    <button class="nav-item yonetici" id="btn-musteri" onclick="sekmeAc('musteri')">🧑‍🤝‍🧑 Müşteriler</button>
    <button class="nav-item yonetici" id="btn-rehber" onclick="sekmeAc('rehber')">🧭 Rehber Hesapları</button>
    <button class="nav-item yonetici" id="btn-sehir" onclick="sekmeAc('sehir')">🗺️ Şehir Rehberi</button>
    <div class="nav-baslik yonetici">Site Yönetimi</div>
    <button class="nav-item yonetici" id="btn-basvuru" onclick="sekmeAc('basvuru')">📥 Başvurular <span id="yeniSayac" style="display:none;background:#dc3545;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:50px;margin-left:4px"></span></button>
    <button class="nav-item yonetici" id="btn-turlar" onclick="sekmeAc('turlar')">📋 Tur Listesi</button>
    <button class="nav-item yonetici" id="btn-duyuru" onclick="sekmeAc('duyuru')">📢 Duyurular</button>
    <button class="nav-item yonetici" id="btn-yorum" onclick="sekmeAc('yorum')">💬 Yorumlar</button>
  </div>
  <div class="main">
    <div class="kullanici-serit"><span id="kullaniciBilgi"></span><button type="button" class="kullanici-cikis" onclick="cikisYap()">Çıkış</button></div>
    <div id="sayfa-ana" style="display:none"></div>
    <div id="sayfa-basvuru" style="display:none"></div>
    <div id="sayfa-turlar"></div>
    <div id="sayfa-ekle" style="display:none"></div>
  <div id="sayfa-duyuru" style="display:none"></div>
    <div id="sayfa-kafile" style="display:none"></div>
    <div id="sayfa-yorum" style="display:none"></div>
    <div id="sayfa-musteri" style="display:none"></div>
    <div id="sayfa-rehber" style="display:none"></div>
    <div id="sayfa-sehir" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const sb = supabase.createClient('https://wpkjxwbvewwgdclbsdya.supabase.co', 'sb_publishable_bEXKjIeKKN4JrMkOPy3LQg_ZuSlEQNK');

// Roller: admin (her şey) · rehber (yalnızca atandığı kafilelerin katılımcı/oda listesi; veritabanı da aynı sınırı uygular)
let ROL = null;
const REHBER_ALAN = '@rehber.ismailcosarturizm.com.tr';
async function paneliAc() {
  let uid = null;
  let eposta = '';
  try { const { data } = await sb.auth.getUser(); uid = data && data.user && data.user.id; eposta = (data && data.user && data.user.email) || ''; } catch (e) {}
  const { data: r } = uid ? await sb.from('kullanici_rolleri').select('*').eq('user_id', uid).maybeSingle() : { data: null };
  ROL = r ? r.rol : null;
  const ki = document.getElementById('kullaniciBilgi');
  if (ki && r) ki.textContent = '👤 ' + (r.ad || eposta.split('@')[0]) + (r.rol === 'rehber' ? ' · Rehber' + (r.kullanici_adi ? ' (' + r.kullanici_adi + ')' : '') : ' · Yönetici');
  const mu = document.querySelector('.mobil-ust span'); if (mu) mu.textContent = ROL === 'rehber' ? 'Rehber' : 'Yönetim';
  if (ROL !== 'admin' && ROL !== 'rehber') {
    await sb.auth.signOut();
    const e = document.getElementById('loginErr'); e.textContent = 'Bu hesaba yetki tanımlanmamış.'; e.style.display = 'block';
    document.getElementById('loginDiv').style.display = 'flex'; document.getElementById('appDiv').style.display = 'none';
    return;
  }
  document.body.classList.toggle('rol-rehber', ROL === 'rehber');
  document.getElementById('btn-kafile').textContent = ROL === 'rehber' ? '👥 Gruplarım' : '🧳 Gruplar';
  document.getElementById('loginDiv').style.display = 'none';
  document.getElementById('appDiv').style.display = 'flex';
  sekmeAc(ROL === 'rehber' ? 'kafile' : 'ana');
}

window.onload = async () => {
  document.getElementById('appDiv').style.display = 'none';
  document.getElementById('loginDiv').style.display = 'flex';
  const { data } = await sb.auth.getSession();
  if (data && data.session) paneliAc();
};

document.querySelectorAll('#loginDiv input').forEach(i => {
  i.addEventListener('keydown', e => { if(e.key==='Enter') girisYap(); });
});

async function girisYap() {
  let email = document.getElementById('uname').value.trim();
  if (email && !email.includes('@')) email = email.toLocaleLowerCase('en') + REHBER_ALAN; // rehber: yalnızca kullanıcı adı
  const password = document.getElementById('upass').value;
  const btn = document.getElementById('girisBtn');
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Giriş Yap';
  if (!error) {
    document.getElementById('upass').value = '';
    paneliAc();
  } else {
    document.getElementById('loginErr').textContent = 'Kullanıcı adı / e-posta veya şifre yanlış!';
    document.getElementById('loginErr').style.display = 'block';
    setTimeout(() => document.getElementById('loginErr').style.display = 'none', 3000);
  }
}

async function cikisYap() {
  await sb.auth.signOut(); ROL = null; document.body.classList.remove('rol-rehber');
  document.getElementById('loginDiv').style.display = 'flex';
  document.getElementById('appDiv').style.display = 'none';
}

function mobilGit(ad) { document.getElementById('mobilDiger').hidden = true; sekmeAc(ad); window.scrollTo(0, 0); }
function sekmeAc(ad) {
  if (ROL === 'rehber') ad = 'kafile';
  const anaM = { ana: 1, kafile: 1, musteri: 1, basvuru: 1 }, mAd = anaM[ad] ? ad : 'diger';
  document.querySelectorAll('.mobil-alt button').forEach(b => b.classList.toggle('active', b.dataset.m === mAd));
  // "Diğer" altındaki bir sayfadaysak 5. düğme o sayfanın adını gösterir (hangi ekranda olduğu belli olsun)
  const DIGER_AD = { rehber: ['🧭', 'Rehberler'], sehir: ['🗺️', 'Şehir R.'], turlar: ['📋', 'Turlar'], ekle: ['📋', 'Turlar'], duyuru: ['📢', 'Duyurular'], yorum: ['💬', 'Yorumlar'] }[ad] || ['☰', 'Diğer'];
  const di = document.getElementById('mobilDigerIkon'), da = document.getElementById('mobilDigerAd');
  if (di) di.textContent = DIGER_AD[0]; if (da) da.textContent = DIGER_AD[1];
  ['ana','basvuru','turlar','ekle','duyuru','kafile','yorum','musteri','rehber','sehir'].forEach(s => {
    document.getElementById('sayfa-' + s).style.display = s === ad ? 'block' : 'none';
    const btn = document.getElementById('btn-' + s);
    if (btn) btn.classList.toggle('active', s === ad);
    if (btn && s === ad && btn.scrollIntoView) { try { btn.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {} } // telefonda üst şeritte seçili sekme görünsün
  });
  if (ad === 'ana') renderAna();
  if (ad === 'basvuru') renderBasvurular();
  if (ad === 'turlar') renderTurlar();
  if (ad === 'ekle') { renderEkle(); const tb = document.getElementById('btn-turlar'); if (tb) tb.classList.add('active'); } // Yeni tur formu Tur Listesi'nin içinde
  if (ad === 'duyuru') renderDuyuru();
  if (ad === 'kafile') renderKafileler();
  if (ad === 'yorum') renderYorumlar();
  if (ad === 'musteri') renderMusteriler();
  if (ad === 'rehber') renderRehberler();
  if (ad === 'sehir') renderSehirRehberi();
}

// ── ANA SAYFA (girişte açılır): iki bölüm, Grup Yönetimi ve Site Yönetimi ──
async function renderAna() {
  const el = document.getElementById('sayfa-ana');
  const b = (sekme, baslik, alt) => { const i = baslik.indexOf(' '); return `<button type="button" onclick="sekmeAc('${sekme}')"><span><i class="ana-ikon">${baslik.slice(0, i)}</i> ${baslik.slice(i + 1)}</span><small>${alt}</small></button>`; };
  el.innerHTML = `<div class="header"><h2>Hoş geldiniz</h2></div>

// Mevcut bir turun bütün bilgileriyle yeni bir tur oluşturur. Kopya "(KOPYA)" başlıklı ve PASİF olarak
// oluşur (düzenlenmeden sitede görünmez); ardından kopyanın düzenleme ekranı açılır.
async function turKopyala(id) {
  const { data, error: okumaHatasi } = await sb.from('turlar').select('*').eq('id', id).single();
  if (okumaHatasi || !data) { toast('❌ Tur okunamadı', 'error'); return; }
  if (!confirm('"' + data.baslik + '" turunun bir kopyası oluşturulsun mu?\n\nKopya pasif olarak oluşur; tarihleri ve başlığı düzenleyip Aktif yaptığınızda sitede görünür.')) return;
  const kopya = Object.assign({}, data);
  kopya.id = 'tur-' + Date.now();
  kopya.baslik = '(KOPYA) ' + String(data.baslik || '').replace(/^\(KOPYA\)\s*/, '');
  kopya.aktif = false;
  kopya.kontenjan = 'var';
  const { error } = await sb.from('turlar').insert(kopya);
  if (error) { toast('❌ Kopyalanamadı: ' + error.message, 'error'); return; }
  toast('✅ Kopya oluşturuldu. Tarihleri ve başlığı düzenleyip Aktif yapın.', 'success');
  turDuzenle(kopya.id);
}

async function turSil(id) {
  if (!confirm('Bu turu silmek istediğinizden emin misiniz?')) return;
  const { error } = await sb.from('turlar').delete().eq('id', id);
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Tur silindi', 'success');
  renderTurlar();
}

const KAFILE_URL = 'https://ismailcosarturizm.com.tr/kafile/';
const KOD_HARF = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // karışan 0/O, 1/I yok
const TUR_TURLERI = { umre: 'Umre', hac: 'Hac', kultur: 'Kültür turu' };

function kafileKodUret(ad) {
  const tr = {'Ç':'C','Ğ':'G','İ':'I','I':'I','Ö':'O','Ş':'S','Ü':'U'};
  let on = String(ad || '').toLocaleUpperCase('tr').replace(/[ÇĞİIÖŞÜ]/g, c => tr[c]).replace(/[^A-Z]/g, ' ').trim().split(/\s+/)[0] || 'GRUP';
  on = on.slice(0, 8);
  const r = new Uint32Array(5); crypto.getRandomValues(r);
  return on + '-' + Array.from(r, x => KOD_HARF[x % KOD_HARF.length]).join('');
}

// Yeni grupta kod, grup adı yazıldıkça adın ilk kelimesiyle güncellenir (ör. KASIM-7K3QX); kod elle değiştirildiyse dokunulmaz
function kodOto() {
  const k = document.getElementById('k_kod'), ad = document.getElementById('k_ad');
  if (!k || !ad || k.dataset.elle) return;
  const ek = (k.value.split('-').pop() || '').slice(0, 5);
  const yeni = kafileKodUret(ad.value);
  k.value = /^[A-Z2-9]{5}$/.test(ek) ? yeni.replace(/-[^-]*$/, '-' + ek) : yeni;
}
function kafileTarih(t) { return t ? new Date(t + 'T12:00:00').toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'}) : '—'; }

function kafilePaylasMetni(k) {
  return `${k.ad} – Misafir uygulamanız:\n${KAFILE_URL}#${k.kod}\n\nBağlantıyı açın; telefonunuza "Ana ekrana ekle" ile uygulama olarak kurabilirsiniz. Grup kodu: ${k.kod}`;
}

// Transfer listesi: her satırda tarih (gg.aa.yyyy) ve saat aranır; kalan yazılar sırayla "nereden → nereye"
function buyukHarfDuzelt(t) { // "MAKKAH HOTEL" → "Makkah Hotel"; Türkçe harf varsa Türkçe kurallarla ("ÇARŞI" → "Çarşı")
  t = String(t || ''); const tr = /[ÇĞİÖŞÜçğıöşü]/.test(t);
  return (tr ? t.toLocaleLowerCase('tr') : t.toLowerCase()).replace(/(^|[\s\-/(])(\S)/g, (m, a, b) => a + (tr ? b.toLocaleUpperCase('tr') : b.toUpperCase()));
}
function programYapistir() {
  const kutu = document.getElementById('k_program_yapistir'), tablo = tabloOku(kutu.value || '');
  const yeni = [];
  tablo.forEach(h => {
    let tarih = '', saat = ''; const yazi = [];
    h.forEach(x => {
      if (!tarih && tarihOkuGenel(x)) { tarih = tarihOkuGenel(x); return; }
      const sa = x.match(/^(\d{1,2})[:.](\d{2})$/); if (!saat && sa && +sa[1] < 24) { saat = sa[1].padStart(2, '0') + ':' + sa[2]; return; }
      if (!x || /^\d+$/.test(x) || /^(BUS|OTOBUS|OTOBÜS|VAN|ARAC|ARAÇ|MINIBUS|MİNİBÜS|TREN|TRAIN)$/i.test(x)) return;
      yazi.push(x);
    });
    if (!tarih || !yazi.length) return;
    const nereye = yazi[yazi.length - 1], nereden = yazi.length > 1 ? yazi[yazi.length - 2] : '';
    yeni.push({ tarih, saat, baslik: '🚌 ' + buyukHarfDuzelt(nereye), yer: buyukHarfDuzelt(nereden), konum: '' });
  });
  if (!yeni.length) { toast('❌ Tarihli satır bulunamadı', 'error'); return; }
  const k = document.getElementById('k_program');
  k.querySelectorAll('.prog-satir').forEach(sr => { if (!sr.querySelector('.p_baslik').value.trim()) sr.remove(); });
  k.insertAdjacentHTML('beforeend', yeni.map(programSatiri).join(''));
  kutu.value = '';
  toast(`✅ ${yeni.length} satır programa eklendi; kontrol edip Kaydet'e basın`, 'success');
}
function programSatirEkle() {
  const kutu = document.getElementById('k_program');
  const son = kutu.querySelector('.prog-satir:last-child');
  kutu.insertAdjacentHTML('beforeend', programSatiri({ tarih: son ? son.querySelector('.p_tarih').value : '' }));
}

async function rehberEsitle(kafileId) {

async function kafileKaydet(id) {

  if (k.yorum_link && !/^https:\/\//.test(k.yorum_link)) { toast('❌ Google yorum bağlantısı https:// ile başlamalı', 'error'); return; }
  if (!id) k.id = yeniKimlik(); // rehber atamaları için kimlik önceden belli olsun
  const { error } = id ? await sb.from('kafileler').update(k).eq('id', id) : await sb.from('kafileler').insert(k);

// ── KATILIMCILAR (kafiledeki misafirler ve oda numaraları; yalnızca admin, uygulamada görünmez) ──
const KT = { kafile: null, liste: [], musteriler: [], duzenlenen: null, onizleme: [] };
function telNorm(t) { const d = String(t || '').replace(/\D/g, ''); return d.length >= 10 ? d.slice(-10) : d; }
function adNorm(a) { return String(a || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('tr'); }
function adDuzelt(a) { return String(a || '').trim().replace(/\s+/g, ' '); }
// "12.03.1955", "12/3/55", "1955-03-12" → "1955-03-12"; boş → ''; okunamazsa null
function tarihOku(s) {
  s = String(s || '').trim(); if (!s) return '';
  let g, a, y, m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +m[1]; a = +m[2]; g = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2}|\d{4})$/))) {
    g = +m[1]; a = +m[2]; y = +m[3];
    if (m[3].length === 2) y += (y > new Date().getFullYear() % 100 ? 1900 : 2000);
  } else return null;
  const t = new Date(Date.UTC(y, a - 1, g));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== a - 1 || t.getUTCDate() !== g || y < 1900 || t > new Date()) return null;
  return `${y}-${String(a).padStart(2, '0')}-${String(g).padStart(2, '0')}`;
}
function tarihGoster(t) { return t ? t.split('-').reverse().join('.') : ''; }
function odaAnahtarlari(k) {
  const l = []; ((k && k.oteller) || []).filter(o => o && o.ad).forEach(o => { const a = o.sehir || o.ad; if (!l.includes(a)) l.push(a); });
  return l.length ? l : ['Oda'];
}
// Oda kaydı: odalar[otel] = { no, tip, giris, cikis } (eski kayıtlarda yalnızca "512" metni olabilir).
// Giriş/çıkış boşsa grubun otel tarihleri geçerlidir.
const ODA_TIPLERI = ['Tek kişilik', '2 kişilik', '3 kişilik', '4 kişilik', '5 kişilik', 'Suit'];
function otelAl(a) { return ((KT.kafile && KT.kafile.oteller) || []).find(x => x && x.ad && (x.sehir || x.ad) === a) || {}; }
function odaBilgi(odalar, a) {
  const v = (odalar || {})[a], o = otelAl(a);
  const b = typeof v === 'string' ? { no: v } : Object.assign({}, v || {});
  b.giris = b.giris || o.giris || ''; b.cikis = b.cikis || o.cikis || '';
  return b;
}
function tipOku(t) { t = String(t || '').replace(/\s*\/\s*/g, '/').replace(/\s+/g, ' ').trim(); const n = t.match(/^(\d)\s*(kişilik|kisilik|k)?$/i); return n ? (n[1] === '1' ? 'Tek kişilik' : n[1] + ' kişilik') : t; }
function kisaTarih(t) { return t ? t.slice(8, 10) + '.' + t.slice(5, 7) : ''; }
function odaOzet(b, tarihli) {
  const p = [b.no ? 'Oda ' + b.no : '', b.tip].filter(Boolean).join(' · ');
  const g = geceSayisi(b.giris, b.cikis);
  return tarihli && b.giris && b.cikis ? p + (p ? ' · ' : '') + kisaTarih(b.giris) + '–' + kisaTarih(b.cikis) + (g ? ' (' + g + ' gece)' : '') : p;
}
// Oda doluluğu: "2 kişilik" odaya 3. kişi girilirse uyarı. Suit ve tipi girilmemiş odalarda sınır yok.
function odaKapasite(tip) { // "2 kişilik", "Tek kişilik", ya da otel kısaltmaları: SNGL, DBL/KNG, TRPL/EKSTRA BED, QUAD
  if (!tip) return null; const t = basNorm(tip), ek = /EKSTRA|EXTRA|ILAVE/.test(t) ? 1 : 0;
  if (/^TEK|^SNGL|^SGL|^SINGLE/.test(t)) return 1 + ek;
  if (/^DBL|^DOUBLE|^TWN|^TWIN|^DUBLE/.test(t)) return 2 + ek;
  if (/^TRPL|^TRP|^TRIPLE/.test(t)) return 3 + ek;
  if (/^QUAD|^QDR|^QUADR/.test(t)) return 4 + ek;
  const n = String(tip).match(/(\d+)/); return n ? +n[1] + ek : null;
}
function odaSorunlari(kisiler) { // kisiler: [{ ad, odalar }] → [{ otel, no, metin, adlar }]
  const out = [];
  odaAnahtarlari(KT.kafile).forEach(a => {
    const grup = {};
    kisiler.forEach(k => { const b = odaBilgi(k.odalar, a); if (b.no) (grup[b.no] = grup[b.no] || []).push({ ad: k.ad, tip: b.tip }); });
    Object.keys(grup).forEach(no => {
      const l = grup[no], tipler = [...new Set(l.map(x => x.tip).filter(Boolean))], kap = Math.min(...tipler.map(odaKapasite).filter(Boolean));
      const yer = odaEtiket(a) + ' · Oda ' + no;
      if (isFinite(kap) && l.length > kap) out.push({ otel: a, no, adlar: l.map(x => x.ad), metin: `${yer}: ${tipler.join(' / ')} odada ${l.length} kişi (${l.map(x => x.ad).join(', ')})` });
      else if (tipler.length > 1) out.push({ otel: a, no, adlar: l.map(x => x.ad), metin: `${yer}: aynı odaya farklı oda tipleri girilmiş (${tipler.join(', ')})` });
    });
  });
  return out;
}
function odaEtiket(a) { // "Mekke (Hilton Suites)"
  const o = ((KT.kafile && KT.kafile.oteller) || []).find(x => x && x.ad && (x.sehir || x.ad) === a);
  return o && o.ad && o.ad !== a ? a + ' (' + o.ad + ')' : a;
}
function yeniKimlik() { return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16))); }
// Aynı kişi mi? Ad aynı + (telefon ya da doğum tarihi aynı). Aynı telefonu aile paylaşabilir; bu yüzden ad da şart.
function musteriBul(ad, tel, dogum) {
  const a = adNorm(ad), t = telNorm(tel);
  return KT.musteriler.find(m => adNorm(m.ad) === a && ((t && telNorm(m.telefon) === t) || (dogum && m.dogum_tarihi === dogum))) || null;
}

          <td>${x.m.telefon ? `<a href="tel:${esc(String(x.m.telefon).replace(/[^\d+]/g, ''))}">${esc(x.m.telefon)}</a>` : ''}</td><td>${tarihGoster(x.m.dogum_tarihi)}</td>

async function topluOdaKaydet() {

  document.querySelectorAll('.toplu-oda .to_no').forEach(i => {
    const id = +i.getAttribute('data-kat'), a = i.getAttribute('data-otel'), v = i.value.trim(), od = yeni[id];
    let e = od[a]; if (typeof e === 'string') e = { no: e }; e = Object.assign({}, e || {});
    if (v) e.no = v; else delete e.no;
    if (Object.keys(e).length) od[a] = e; else delete od[a];
  });
  const degisen = KT.liste.filter(x => JSON.stringify(yeni[x.kat.id]) !== JSON.stringify(x.kat.odalar || {}));
  if (!degisen.length) { KT.topluOda = false; katilimciCiz(); toast('Değişiklik yok', 'success'); return; }
  const sorun = odaSorunlari(KT.liste.map(x => ({ ad: x.m.ad, odalar: yeni[x.kat.id] })));
  if (sorun.length && !confirm('⚠️ ' + sorun.map(o => o.metin).join('\n⚠️ ') + '\n\nYine de kaydedilsin mi?')) return;
  for (const x of degisen) {
    const { error } = await sb.from('kafile_katilimcilar').update({ odalar: yeni[x.kat.id] }).eq('id', x.kat.id);
    if (error) { toast('❌ ' + x.m.ad + ': ' + error.message, 'error'); return; }
  }
  toast(`✅ ${degisen.length} kişinin odası kaydedildi`, 'success');
  KT.topluOda = false; kafileKatilimcilar(KT.kafile.id);
}
function odaGeceGoster(i) { const b = i.closest('.oda-blok'); b.querySelector('.kt_gece').textContent = geceYazi(b.querySelector('.kt_giris').value, b.querySelector('.kt_cikis').value); }
function katilimciDuzenle(katId) {

function katilimciFormOku() {

// Bir kişiyi müşteri tablosuna (yoksa) ekler; müşteri kimliğini döner. Eksik bilgileri tamamlar, var olanı ezmez.
async function musteriHazirla(v) {
  const var_ = musteriBul(v.ad, v.telefon, v.dogum);
  if (var_) {
    const ek = {};
    if (!var_.telefon && v.telefon) ek.telefon = v.telefon;
    if (!var_.dogum_tarihi && v.dogum) ek.dogum_tarihi = v.dogum;
    if (v.izin && !var_.ileti_izni) { ek.ileti_izni = true; ek.ileti_izni_tarih = new Date().toISOString(); }
    if (Object.keys(ek).length) { const { error } = await sb.from('musteriler').update(ek).eq('id', var_.id); if (error) throw error; Object.assign(var_, ek); }
    return var_.id;
  }
  const m = { id: yeniKimlik(), ad: v.ad, telefon: v.telefon || null, dogum_tarihi: v.dogum || null, ileti_izni: !!v.izin, ileti_izni_tarih: v.izin ? new Date().toISOString() : null };
  const { error } = await sb.from('musteriler').insert(m); if (error) throw error;
  KT.musteriler.push(m); return m.id;
}

async function katilimciKaydet() {
  const v = katilimciFormOku(), d = KT.duzenlenen;
  if (v.ad.length < 2) { toast('❌ Ad soyad gerekli', 'error'); return; }
  const kisiler = KT.liste.filter(x => !d || x.kat.id !== d.kat.id).map(x => ({ ad: x.m.ad, odalar: x.kat.odalar })).concat([{ ad: v.ad, odalar: v.odalar }]);
  const sorun = odaSorunlari(kisiler).filter(o => o.adlar.includes(v.ad));
  if (sorun.length && !confirm('⚠️ ' + sorun.map(o => o.metin).join('\n⚠️ ') + '\n\nYine de kaydedilsin mi? (Ek yatak vb. durumlar için)')) return;
  try {
    if (d) {
      const ek = { ad: v.ad, telefon: v.telefon || null, dogum_tarihi: v.dogum || null };
      if (v.izin !== !!d.m.ileti_izni) { ek.ileti_izni = v.izin; ek.ileti_izni_tarih = v.izin ? new Date().toISOString() : null; }
      let r = await sb.from('musteriler').update(ek).eq('id', d.m.id); if (r.error) throw r.error;
      r = await sb.from('kafile_katilimcilar').update({ odalar: v.odalar }).eq('id', d.kat.id); if (r.error) throw r.error;
      toast('✅ Kaydedildi', 'success');
    } else {
      const mid = await musteriHazirla(v);
      if (KT.liste.some(x => x.m.id === mid)) { toast('❌ Bu kişi listede zaten var', 'error'); return; }
      const { error } = await sb.from('kafile_katilimcilar').insert({ kafile_id: KT.kafile.id, musteri_id: mid, odalar: v.odalar }); if (error) throw error;
      toast('✅ Eklendi', 'success');
    }
  } catch (e) { toast('❌ ' + (e.message || e), 'error'); return; }
  kafileKatilimcilar(KT.kafile.id);
}

async function katilimciCikar(katId) {
  const x = KT.liste.find(y => y.kat.id === katId);
  if (!x || !confirm(`${x.m.ad} bu gruptan çıkarılsın mı? (Müşteri kaydı silinmez.)`)) return;

// ── Akıllı Excel yapıştırma: kolonlar başlık adından tanınır, tanınmayan kolon elle seçilir, seçim hatırlanır ──
// Excel'den kopyalanan metin: sekmeyle ayrılmış; çok satırlı hücreler tırnak içinde gelir.
function tabloOku(metin) {
  const satirlar = []; let satir = [], hucre = '', tirnak = false;
  const ayir = metin.includes('\t') ? '\t' : ';';
  for (let i = 0; i < metin.length; i++) {
    const c = metin[i];
    if (tirnak) {
      if (c === '"' && metin[i + 1] === '"') { hucre += '"'; i++; }
      else if (c === '"') tirnak = false;
      else hucre += c;
    } else if (c === '"' && hucre === '') tirnak = true;
    else if (c === ayir) { satir.push(hucre); hucre = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && metin[i + 1] === '\n') i++; satir.push(hucre); satirlar.push(satir); satir = []; hucre = ''; }
    else hucre += c;
  }
  if (hucre !== '' || satir.length) { satir.push(hucre); satirlar.push(satir); }
  return satirlar.map(s => s.map(x => x.replace(/\s+/g, ' ').trim())).filter(s => s.some(Boolean));
}
function basNorm(t) { return String(t || '').toLocaleUpperCase('tr').replace(/İ/g, 'I').replace(/Ş/g, 'S').replace(/Ğ/g, 'G').replace(/Ü/g, 'U').replace(/Ö/g, 'O').replace(/Ç/g, 'C').replace(/[^A-Z0-9]/g, ''); }
const KOLON_ADLARI = {
  sira: ['SN', 'SIRA', 'SIRANO', 'NO'],
  adsoyad: ['ADSOYAD', 'ADISOYADI', 'ADSOYADI', 'ISIMSOYISIM', 'ISIM', 'FULLNAME', 'NAME', 'YOLCU', 'MISAFIR', 'KATILIMCI'],
  ad: ['ADI', 'AD', 'FIRSTNAME'],
  soyad: ['SOYADI', 'SOYAD', 'SURNAME', 'LASTNAME'],
  telefon: ['TEL', 'TELEFON', 'GSM', 'CEP', 'CEPTEL', 'PHONE', 'TELNO'],
  dogum: ['DOGUMTARIHI', 'DTARIHI', 'DOGUM', 'DT', 'DTARIH', 'BIRTHDATE', 'DOB'],
  no: ['ODSY', 'ODANO', 'ODA', 'ODANUMARASI', 'ROOM', 'ROOMNO'],
  tip: ['TIPI', 'TIP', 'ODATIPI', 'ODATIP', 'TYPE', 'ROOMTYPE'],
  giris: ['GRSTRH', 'GIRIS', 'GIRISTARIHI', 'GRS', 'CHECKIN'],
  ara: ['ARATRH', 'ARA', 'ARATARIH', 'GECIS'],
  cikis: ['CKSTRH', 'CIKIS', 'CIKISTARIHI', 'CKS', 'CHECKOUT']
};
function kolonTahmin(baslik) {
  const b = basNorm(baslik); if (!b) return '';
  for (const [k, l] of Object.entries(KOLON_ADLARI)) if (l.includes(b)) return k;
  return 'yok';
}
// Seçenekler: genel alanlar + her otel için ayrı oda no/tip/giriş/çıkış
function kolonSecenekleri() {
  const anah = odaAnahtarlari(KT.kafile), l = [['yok', '— Kullanma'], ['adsoyad', 'Ad soyad'], ['ad', 'Ad'], ['soyad', 'Soyad'], ['telefon', 'Telefon'], ['dogum', 'Doğum tarihi'],
    ['no', 'Oda no' + (anah.length > 1 ? ' (tüm oteller)' : '')], ['tip', 'Oda tipi' + (anah.length > 1 ? ' (tüm oteller)' : '')], ['giris', 'Giriş tarihi (ilk otel)'], ['ara', 'Ara tarih (otel değişimi)'], ['cikis', 'Çıkış tarihi (son otel)']];
  if (anah.length > 1) anah.forEach(a => l.push(['no:' + a, 'Oda no – ' + a], ['tip:' + a, 'Oda tipi – ' + a], ['giris:' + a, 'Giriş – ' + a], ['cikis:' + a, 'Çıkış – ' + a]));
  l.push(['sira', 'Sıra no (kullanma)']);
  return l;
}
const KOLON_ESKI_SIRA = ['adsoyad', 'telefon', 'dogum']; // başlıksız eski düzen: Ad Soyad · Telefon · Doğum · (her otel için) Oda no · Oda tipi
function eskiSiraAlani(i) {
  if (i < 3) return KOLON_ESKI_SIRA[i];
  const anah = odaAnahtarlari(KT.kafile), k = i - 3, a = anah[Math.floor(k / 2)];
  return a ? (k % 2 ? 'tip:' : 'no:') + a : 'yok';
}
function tarihOkuGenel(s) { // ileri tarihlere de izin verir (giriş/çıkış)
  s = String(s || '').trim(); let m, g, a, y;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +m[1]; a = +m[2]; g = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4}|\d{2})$/))) { g = +m[1]; a = +m[2]; y = +m[3]; if (m[3].length === 2) y += 2000; }
  else return '';
  const t = new Date(Date.UTC(y, a - 1, g));
  return (t.getUTCMonth() === a - 1 && t.getUTCDate() === g && y > 2000) ? `${y}-${String(a).padStart(2, '0')}-${String(g).padStart(2, '0')}` : '';
}
function tabloImzasi(b) { return 'kt-kolon:' + b.map(basNorm).join('|'); }

function katilimciOnizle(elleEslesme) {
  const metin = (document.getElementById('kt_yapistir') || {}).value || '';
  const tablo = tabloOku(metin);
  // Başlık satırı: ilk 15 satırda en az 2 kolonu tanınan satır
  let bi = -1;
  for (let i = 0; i < Math.min(15, tablo.length); i++) {
    const k = tablo[i].map(kolonTahmin), tanınan = k.filter(x => x && x !== 'yok' && x !== 'sira').length;
    if (tanınan >= 2 && k.some(x => x === 'ad' || x === 'adsoyad' || x === 'soyad') && !tablo[i].some(x => /\d{1,2}[./]\d{1,2}[./]\d{2,4}/.test(x))) { bi = i; break; }
  }
  const basliklar = bi >= 0 ? tablo[bi] : [];
  const genislik = Math.max(0, ...tablo.map(s => s.length));
  let es = elleEslesme;
  if (!es) {
    let kayitli = null; try { kayitli = JSON.parse(localStorage.getItem(tabloImzasi(basliklar)) || 'null'); } catch (e) {}
    es = [];
    for (let i = 0; i < genislik; i++) es.push((kayitli && kayitli[i]) || (basliklar[i] ? kolonTahmin(basliklar[i]) || 'yok' : (bi >= 0 ? 'yok' : eskiSiraAlani(i))));
  }
  KT.eslesme = es; KT.basliklar = basliklar; KT.tablo = tablo; KT.baslikSatiri = bi;
  const anah = odaAnahtarlari(KT.kafile), onceki = {};
  const veri = tablo.slice(bi + 1).map(h => {
    const al = {}; es.forEach((k, i) => { if (k && k !== 'yok' && k !== 'sira' && h[i]) al[k] = h[i]; });
    let ad = adDuzelt(al.adsoyad || [al.ad, al.soyad].filter(Boolean).join(' '));
    // BÜYÜK HARF isim → "Ali Yılmaz". Türkçe harf (İ, Ş, Ğ…) varsa Türkçe kurallar; tablo Türkçe karaktersiz yazılmışsa ("SAIT") I → i ("Sait", "Saıt" değil)
    if (ad && ad === ad.toLocaleUpperCase('tr')) { const tr = /[İŞĞÜÖÇ]/.test(ad); ad = (tr ? ad.toLocaleLowerCase('tr') : ad.toLowerCase()).replace(/(^|[\s\-'])(\S)/g, (m, x, y) => x + (tr ? y.toLocaleUpperCase('tr') : y.toUpperCase())); }
    if (!ad || ad.length < 2 || !/[a-zçğıöşüA-ZÇĞİÖŞÜ]/.test(ad)) { return null; }
    // Birleştirilmiş hücreler: oda no / tip / tarihler boşsa bir önceki kişininkini al
    ['no', 'tip', 'giris', 'ara', 'cikis'].concat(anah.flatMap(a => ['no:' + a, 'tip:' + a, 'giris:' + a, 'cikis:' + a])).forEach(k => {
      if (es.includes(k)) { if (al[k]) onceki[k] = al[k]; else if (onceki[k]) al[k] = onceki[k]; }
    });
    const v = { ad, telefon: al.telefon || '', dogumHam: al.dogum || '', odalar: {}, sorun: '' };
    anah.forEach((a, i) => {
      const e = {}, o = otelAl(a);
      const no = al['no:' + a] || al.no, tip = al['tip:' + a] || al.tip;
      let g = al['giris:' + a] || (i === 0 ? al.giris : (i === 1 ? al.ara : '')) || '';
      let c = al['cikis:' + a] || (i === anah.length - 1 ? al.cikis : (i === 0 ? al.ara : '')) || '';
      g = tarihOkuGenel(g); c = tarihOkuGenel(c);
      if (no) e.no = no; if (tip) e.tip = tipOku(tip);
      if (g && g !== o.giris) e.giris = g; if (c && c !== o.cikis) e.cikis = c;
      if (Object.keys(e).length) v.odalar[a] = e;
    });
    v.dogum = tarihOku(v.dogumHam);
    if (v.dogum === null) { v.sorun = 'Doğum tarihi okunamadı, boş bırakılacak'; v.dogum = ''; v.uyari = true; }
    const m = musteriBul(v.ad, v.telefon, v.dogum);
    if (m && KT.liste.some(x => x.m.id === m.id)) { v.sorun = 'Zaten listede'; v.uyari = false; }
    else if (m) v.bilgi = 'Kayıtlı müşteri';
    return v;
  }).filter(Boolean);
  KT.onizleme = veri;
  const eklenecek = KT.onizleme.filter(v => !v.sorun || v.uyari);
  const sorunlar = odaSorunlari(KT.liste.map(x => ({ ad: x.m.ad, odalar: x.kat.odalar })).concat(eklenecek.map(v => ({ ad: v.ad, odalar: v.odalar }))));
  eklenecek.forEach(v => { const o = sorunlar.find(x => x.adlar.includes(v.ad)); if (o) v.odaUyari = 'Oda ' + o.no + ' dolu: ' + o.adlar.length + ' kişi'; });
  document.getElementById('kt_onizleme').innerHTML = kolonEslesmeHtml() + katilimciOnizlemeHtml();
}
function kolonDegis() {
  const es = [...document.querySelectorAll('#kt_onizleme .kolon-sec')].map(s => s.value);
  try { localStorage.setItem(tabloImzasi(KT.basliklar || []), JSON.stringify(es)); } catch (e) {}
  katilimciOnizle(es);
}
function kolonEslesmeHtml() {
  if (!KT.tablo || !KT.tablo.length) return '';

async function katilimciTopluEkle() {
  const izin = !!(document.getElementById('kt_toplu_izin') || {}).checked;
  const l = KT.onizleme.filter(v => !v.sorun || v.uyari);
  if (!l.length) return;
  const yeniM = [], kat = [], gorulen = new Set(KT.liste.map(x => x.m.id));
  try {
    for (const v of l) {
      let m = musteriBul(v.ad, v.telefon, v.dogum);
      if (m) {
        const ek = {};
        if (!m.telefon && v.telefon) ek.telefon = v.telefon;
        if (!m.dogum_tarihi && v.dogum) ek.dogum_tarihi = v.dogum;
        if (izin && !m.ileti_izni) { ek.ileti_izni = true; ek.ileti_izni_tarih = new Date().toISOString(); }
        if (Object.keys(ek).length && !yeniM.includes(m)) { const { error } = await sb.from('musteriler').update(ek).eq('id', m.id); if (error) throw error; Object.assign(m, ek); }
      } else {
        m = { id: yeniKimlik(), ad: v.ad, telefon: v.telefon || null, dogum_tarihi: v.dogum || null, ileti_izni: izin, ileti_izni_tarih: izin ? new Date().toISOString() : null };
        yeniM.push(m); KT.musteriler.push(m);
      }
      if (gorulen.has(m.id)) continue; // aynı kişi iki kez yapıştırılmışsa bir kez ekle
      gorulen.add(m.id); kat.push({ kafile_id: KT.kafile.id, musteri_id: m.id, odalar: v.odalar });
    }
    if (yeniM.length) { const { error } = await sb.from('musteriler').insert(yeniM); if (error) throw error; }
    if (kat.length) { const { error } = await sb.from('kafile_katilimcilar').insert(kat); if (error) throw error; }
  } catch (e) { toast('❌ ' + (e.message || e), 'error'); return; }
  toast(`✅ ${kat.length} kişi eklendi`, 'success');
  kafileKatilimcilar(KT.kafile.id);
}

function odaListesiMetni() {
  // WhatsApp'ta okunaklı olsun: her isim ayrı satırda, odası belli olmayanlar numaralı liste
  const k = KT.kafile, anah = odaAnahtarlari(k);
  const tarih = k.baslangic ? kisaTarih(k.baslangic) + (k.bitis ? '–' + kisaTarih(k.bitis) : '') + ' · ' : '';
  const odaVar = KT.liste.some(x => anah.some(a => odaBilgi(x.kat.odalar, a).no));
  const satirlar = ['*' + k.ad + ' – ' + (odaVar ? 'oda listesi' : 'katılımcı listesi') + '*', tarih + KT.liste.length + ' kişi'];
  if (!odaVar) {
    satirlar.push('');
    KT.liste.forEach((x, i) => satirlar.push((i + 1) + '. ' + x.m.ad));
    satirlar.push('', 'Oda numaraları henüz belli değil.');
    return satirlar.join('\n');
  }
  anah.forEach(a => {
    const otel = (k.oteller || []).find(o => (o.sehir || o.ad) === a);
    const og = otel && geceSayisi(otel.giris, otel.cikis);
    satirlar.push('', '🏨 *' + a + (otel && otel.ad && otel.ad !== a ? ' – ' + otel.ad : '') + '*' + (otel && otel.giris && otel.cikis ? ' (' + kisaTarih(otel.giris) + '–' + kisaTarih(otel.cikis) + (og ? ', ' + og + ' gece' : '') + ')' : ''));
    const grup = {}, tip = {}, odasiz = [];
    KT.liste.forEach(x => {
      const b = odaBilgi(x.kat.odalar, a);
      if (!b.no) { odasiz.push(x.m.ad); return; }
      const farkli = otel && (b.giris !== (otel.giris || '') || b.cikis !== (otel.cikis || '')) && b.giris && b.cikis;
      (grup[b.no] = grup[b.no] || []).push(x.m.ad + (farkli ? ' [' + kisaTarih(b.giris) + '–' + kisaTarih(b.cikis) + (geceSayisi(b.giris, b.cikis) ? ', ' + geceSayisi(b.giris, b.cikis) + ' gece' : '') + ']' : ''));
      if (b.tip && !tip[b.no]) tip[b.no] = b.tip;
    });
    Object.keys(grup).sort((p, q) => p.localeCompare(q, 'tr', { numeric: true })).forEach(o => {
      satirlar.push('Oda ' + o + (tip[o] ? ' (' + tip[o] + ')' : ''));
      grup[o].forEach(ad => satirlar.push('   • ' + ad));
    });
    if (odasiz.length) {
      satirlar.push('Odası henüz belli değil (' + odasiz.length + '):');
      odasiz.forEach(ad => satirlar.push('   • ' + ad));
    }
  });
  return satirlar.join('\n');
}
function odaListesiPaylas() {
  const t = odaListesiMetni();
  window.__sonPaylas = t;
  if (navigator.share) navigator.share({ title: t.split('\n')[0].replace(/\*/g, ''), text: t }).catch(() => {});
  else odaListesiKopyala();
}
function odaListesiKopyala() {
  const t = odaListesiMetni();
  const yedek = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); };
  (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).catch(yedek) : Promise.resolve(yedek())).then(() => toast('✅ Oda listesi kopyalandı; WhatsApp\'a yapıştırabilirsiniz', 'success'));
  window.__sonKopya = t;
}

async function renderMusteriler() {

function dogumGunuKalan(t) {
  if (!t) return 9999;
  const b = new Date(); b.setHours(0, 0, 0, 0);
  const [, a, g] = t.split('-').map(Number);
  let d = new Date(b.getFullYear(), a - 1, g); if (d < b) d = new Date(b.getFullYear() + 1, a - 1, g);
  return Math.round((d - b) / 86400000);
}
// Yaklaşan doğum günleri (bugün + 7 gün). WhatsApp butonu yalnızca ileti izni ve telefonu olanlarda.
const DOGUM_MESAJI = 'Sayın {ad}, doğum gününüzü en içten dileklerimizle kutlarız. Nice sağlıklı, huzurlu ve hayırlı yıllara… İsmail Coşar Turizm';
function waNumara(tel) {
  let d = String(tel || '').replace(/\D/g, '');
  if (d.length === 10 && d[0] === '5') d = '90' + d; else if (d.length === 11 && d[0] === '0') d = '9' + d; else if (d.startsWith('00')) d = d.slice(2);
  return d.length >= 11 ? d : '';
}
function yaklasanDogumlar(liste, gun) {
  return liste.filter(m => m.dogum_tarihi && dogumGunuKalan(m.dogum_tarihi) <= gun)
    .map(m => ({ m, kalan: dogumGunuKalan(m.dogum_tarihi) })).sort((x, y) => x.kalan - y.kalan || x.m.ad.localeCompare(y.m.ad, 'tr'));
}
function dogumKartHtml(liste) {
  const l = yaklasanDogumlar(liste, 7);
  if (!l.length) return '';
  const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
  return `<div class="card ana-kart dogum-kart"><h3>🎂 Yaklaşan doğum günleri <span style="font-size:12px;font-weight:400;color:#888">– önümüzdeki 7 gün</span></h3>
    ${l.map(({ m, kalan }) => {
      const gunu = new Date(bugun.getTime() + kalan * 86400000);
      const yas = gunu.getFullYear() - Number(m.dogum_tarihi.slice(0, 4));
      const ne = kalan === 0 ? '<b style="color:#C9972B">bugün</b>' : kalan === 1 ? 'yarın' : gunu.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
      const no = m.ileti_izni ? waNumara(m.telefon) : '';
      return `<div class="dogum-satir" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid #eee">
        <div><b>${esc(m.ad)}</b> <span style="color:#666">· ${ne}${yas > 0 && yas < 120 ? ' · ' + yas + ' yaşına giriyor' : ''}</span></div>
        ${no ? `<a class="btn dogum-wa" style="background:#25D366;color:#fff;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${no}?text=${encodeURIComponent(DOGUM_MESAJI.replace('{ad}', m.ad))}">💬 WhatsApp ile kutla</a>`
             : `<span style="font-size:12px;color:#999">${m.ileti_izni ? 'telefon yok' : 'ileti izni yok'}</span>`}</div>`;
    }).join('')}</div>`;
}
// Doğum günü tur tarihlerine denk geliyorsa "🎂 gg.aa"
function turdaDogum(dt, bas, bit) {
  if (!dt || !bas) return '';
  bit = bit || bas;
  for (let y = Number(bas.slice(0, 4)); y <= Number(bit.slice(0, 4)); y++) {
    const g = y + dt.slice(4);
    if (g >= bas && g <= bit) return '🎂 ' + kisaTarih(g);
  }
  return '';
}

        ${l.map(m => { const kalan = dogumGunuKalan(m.dogum_tarihi); return `<tr class="musteri-satir"><td>${esc(m.ad)}</td><td>${esc(m.telefon || '')}</td>
          <td>${tarihGoster(m.dogum_tarihi)}${kalan === 0 ? ' 🎂 bugün' : kalan <= 30 ? ' <span style="color:#C9972B">(' + kalan + ' gün)</span>' : ''}</td>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">

          <button class="btn btn-red" style="margin-left:auto" onclick="rehberSil('${esc(r.user_id)}')">Hesabı sil</button>

async function rehberOlustur() {
  const ad = document.getElementById('rh_ad').value.trim(), ka = document.getElementById('rh_ka').value.trim().toLocaleLowerCase('en'), sifre = document.getElementById('rh_sifre').value;
  if (ad.length < 2) { toast('❌ Ad soyad gerekli', 'error'); return; }
  if (!/^[a-z0-9._-]{3,30}$/.test(ka)) { toast('❌ Kullanıcı adı 3-30 karakter; Türkçe karakter ve boşluk olmadan (ör. ali.yilmaz)', 'error'); return; }
  if (sifre.length < 8) { toast('❌ Şifre en az 8 karakter olmalı', 'error'); return; }
  const r = await rehberIslem({ islem: 'olustur', ad, kullanici_adi: ka, sifre });
  if (!r) return;
  toast('✅ Hesap açıldı. Görebileceği grupları işaretleyin ve giriş bilgilerini gönderin.', 'success');
  RH_SON = { ad, ka, sifre, yeni: true }; RH_ACIK = false;
  await renderRehberler(); window.scrollTo(0, 0);
}
async function rehberAta(userId, kafileId, ac) {
  const { error } = ac ? await sb.from('kafile_rehberleri').insert({ user_id: userId, kafile_id: kafileId })
                       : await sb.from('kafile_rehberleri').delete().eq('user_id', userId).eq('kafile_id', kafileId);
  if (error) { toast('❌ ' + error.message, 'error'); renderRehberler(); return; }
  toast(ac ? '✅ Grup rehbere açıldı' : '✅ Grup rehberden kaldırıldı', 'success');
}
async function rehberSifre(userId, btn) {
  const kutu = btn.parentElement.querySelector('.rh_yeni_sifre'), sifre = kutu.value;
  if (sifre.length < 8) { toast('❌ Şifre en az 8 karakter olmalı', 'error'); return; }
  if (await rehberIslem({ islem: 'sifre', user_id: userId, sifre })) {
    const it = btn.closest('.rehber-item');
    RH_SON = { ad: it.querySelector('h4').textContent, ka: it.querySelector('.tur-item-info b').textContent, sifre, yeni: false };
    toast('✅ Şifre değiştirildi', 'success'); await renderRehberler(); window.scrollTo(0, 0);
  }
}
async function rehberSil(userId) {
  if (!confirm('Rehber hesabı silinsin mi? Rehber artık giriş yapamaz.')) return;
  if (await rehberIslem({ islem: 'sil', user_id: userId })) { toast('✅ Hesap silindi', 'success'); renderRehberler(); }
}

// ── ŞEHİR REHBERİ (kültür turları: misafir uygulamasının Rehber ekranında gezilecek yerler ve yeme-içme) ──
// Taslaklar uygulamada görünmez; "Yayınla" ile açılır. Uygulama, grubun otel şehirlerini şehir adı ya da "diğer adlar" ile eşleştirir.
const SR = { liste: [], sehir: '', duzenlenen: null };
const SR_TUR = { gezi: '📍 Gezilecek yerler', yemek: '🍽️ Yeme-içme' };
function srHarita(ad, sehir) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ad + ' ' + sehir); }
async function renderSehirRehberi() {
  const el = document.getElementById('sayfa-sehir');
  el.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
  const { data, error } = await sb.from('sehir_rehberi').select('*').order('sira', { ascending: false });
  if (error) { el.innerHTML = '<div class="card">❌ ' + esc(error.message) + '</div>'; return; }
  SR.liste = data || [];
  const sehirler = [...new Set(SR.liste.map(x => x.sehir))].sort((a, b) => a.localeCompare(b, 'tr'));
  if (!sehirler.includes(SR.sehir)) SR.sehir = sehirler[0] || '';
  SR.duzenlenen = null;
  sehirCiz();
}
function sehirCiz() {
  const sehirler = [...new Set(SR.liste.map(x => x.sehir))].sort((a, b) => a.localeCompare(b, 'tr'));
  const l = SR.liste.filter(x => x.sehir === SR.sehir).sort((a, b) => b.sira - a.sira);
  const taslak = l.filter(x => !x.yayinda).length, d = SR.duzenlenen;
  const ornek = l[0] || {};
  const sayi = s => { const k = SR.liste.filter(x => x.sehir === s); const t = k.filter(x => !x.yayinda).length; return `${s} (${k.length}${t ? ', ' + t + ' taslak' : ''})`; };
  document.getElementById('sayfa-sehir').innerHTML = `
    <div class="header"><h2>🗺️ Şehir Rehberi</h2><button class="btn btn-gold" onclick="sehirMekanYeni()">➕ Mekan ekle</button></div>
    <div class="card" style="font-size:13px;color:#555;line-height:1.6">Kültür turlarında misafir uygulamasının <b>Rehber</b> ekranında, grubun otel şehirlerine göre gezilecek yerler ve yeme-içme mekanları çıkar. <b>Taslaklar uygulamada görünmez</b>; kontrol ettiklerinizi “Yayınla” ile açın. Her mekanda “Haritada aç” Google Haritalar'ı açar; güncel puan ve yorumlar oradan görülür.</div>
    ${d ? sehirFormHtml(d) : ''}
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <select id="sr_sehir" onchange="SR.sehir=this.value;SR.duzenlenen=null;sehirCiz()" style="padding:9px;border:1.5px solid #ddd;border-radius:6px;font-size:14px">${sehirler.map(s => `<option value="${esc(s)}" ${s === SR.sehir ? 'selected' : ''}>${esc(sayi(s))}</option>`).join('')}</select>
        ${l.length ? `<button class="btn btn-gold" onclick="sehirTopluYayin(true)" ${taslak ? '' : 'disabled'}>✅ Bu şehrin tümünü yayınla</button><button class="btn btn-navy" onclick="sehirTopluYayin(false)">Tümünü taslağa al</button>` : ''}
      </div>
      ${ornek.diger_adlar && ornek.diger_adlar.length ? `<p style="font-size:12px;color:#888;margin-bottom:10px">Eşleşen adlar: ${esc([SR.sehir].concat(ornek.diger_adlar).join(', '))}</p>` : ''}
      ${['gezi', 'yemek'].map(t => { const k = l.filter(x => x.tur === t); return `<h3 style="margin:14px 0 8px">${SR_TUR[t]} (${k.length})</h3><div class="tur-list">${k.map(x => `
        <div class="tur-item mekan-item" data-id="${x.id}"><div class="tur-item-info"><h4>${esc(x.ad)} <span class="badge ${x.yayinda ? 'badge-green' : 'badge-red'}">${x.yayinda ? 'Yayında' : 'Taslak'}</span></h4><p>${esc(x.aciklama || '')}</p>
          <p><a href="${esc(x.harita || srHarita(x.ad, x.sehir))}" target="_blank" rel="noopener">Haritada aç ↗</a></p></div>
          <div class="tur-item-actions"><button class="btn ${x.yayinda ? 'btn-navy' : 'btn-gold'}" onclick="sehirMekanYayin(${x.id}, ${!x.yayinda})">${x.yayinda ? 'Taslağa al' : 'Yayınla'}</button>
            <button class="btn btn-navy" onclick="sehirMekanDuzenle(${x.id})">Düzenle</button><button class="btn btn-red" onclick="sehirMekanSil(${x.id})">Sil</button></div></div>`).join('') || '<p style="color:#888;font-size:13px">Yok</p>'}</div>`; }).join('')}
      ${sehirler.length ? '' : '<p style="color:#666;font-size:14px">Henüz mekan yok. “Mekan ekle” ile başlayın.</p>'}
    </div>`;
}
function sehirFormHtml(d) {
  return `<div class="card" id="sr_kart"><h3>${d.id ? '✏️ Mekanı düzenle' : '➕ Yeni mekan'}</h3>
    <div class="form-row">
      <div class="form-group"><label>Şehir</label><input id="sr_f_sehir" list="srSehirler" value="${esc(d.sehir || '')}" placeholder="Ör. Saraybosna"><datalist id="srSehirler">${[...new Set(SR.liste.map(x => x.sehir))].map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
      <div class="form-group"><label>Şehrin diğer adları (virgülle)</label><input id="sr_f_diger" value="${esc((d.diger_adlar || []).join(', '))}" placeholder="Sarajevo, Bosna"><div style="font-size:11.5px;color:#888;margin-top:4px">Grupta otel şehri bu adlardan biriyle yazılmışsa da eşleşir.</div></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Tür</label><select id="sr_f_tur">${Object.entries(SR_TUR).map(([k, v]) => `<option value="${k}" ${d.tur === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="form-group"><label>Mekan adı</label><input id="sr_f_ad" value="${esc(d.ad || '')}"></div>
    </div>
    <div class="form-group"><label>Kısa açıklama</label><input id="sr_f_aciklama" value="${esc(d.aciklama || '')}" placeholder="Ne ile bilinir, ipucu"></div>
    <div class="form-group"><label>Harita bağlantısı (boş bırakılırsa ad + şehirle Google Haritalar araması)</label><input id="sr_f_harita" value="${esc(d.harita || '')}" placeholder="https://maps.app.goo.gl/..."></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 12px"><input type="checkbox" id="sr_f_yayinda" ${d.yayinda ? 'checked' : ''}> Yayında (uygulamada görünsün)</label>
    <div style="display:flex;gap:8px"><button class="btn btn-gold" onclick="sehirMekanKaydet()">💾 Kaydet</button><button class="btn btn-navy" onclick="SR.duzenlenen=null;sehirCiz()">Vazgeç</button></div></div>`;
}
function sehirMekanYeni() {
  const ornek = SR.liste.find(x => x.sehir === SR.sehir) || {};
  SR.duzenlenen = { sehir: SR.sehir, diger_adlar: ornek.diger_adlar || [], tur: 'gezi', yayinda: false }; sehirCiz(); window.scrollTo(0, 0);
}
function sehirMekanDuzenle(id) { SR.duzenlenen = SR.liste.find(x => x.id === id) || null; sehirCiz(); window.scrollTo(0, 0); }
async function sehirMekanKaydet() {
  const d = SR.duzenlenen; if (!d) return;
  const v = (i) => document.getElementById(i).value.trim();
  const k = { sehir: v('sr_f_sehir'), diger_adlar: v('sr_f_diger').split(',').map(x => x.trim()).filter(Boolean), tur: v('sr_f_tur'), ad: v('sr_f_ad'),
    aciklama: v('sr_f_aciklama') || null, harita: v('sr_f_harita') || null, yayinda: document.getElementById('sr_f_yayinda').checked };
  if (k.sehir.length < 2 || k.ad.length < 2) { toast('❌ Şehir ve mekan adı gerekli', 'error'); return; }
  if (k.harita && !/^https:\/\//.test(k.harita)) { toast('❌ Harita bağlantısı https:// ile başlamalı', 'error'); return; }
  if (!k.harita) k.harita = srHarita(k.ad, k.sehir);
  if (!d.id) k.sira = Math.min(0, ...SR.liste.filter(x => x.sehir === k.sehir).map(x => x.sira)) - 1;
  const { error } = d.id ? await sb.from('sehir_rehberi').update(k).eq('id', d.id) : await sb.from('sehir_rehberi').insert(k);
  if (error) { toast('❌ ' + error.message, 'error'); return; }
  // Aynı şehrin diğer adları tüm mekanlarda aynı olsun
  if (SR.liste.some(x => x.sehir === k.sehir && x.id !== d.id && JSON.stringify(x.diger_adlar || []) !== JSON.stringify(k.diger_adlar))) await sb.from('sehir_rehberi').update({ diger_adlar: k.diger_adlar }).eq('sehir', k.sehir);
  toast('✅ Kaydedildi', 'success'); SR.sehir = k.sehir; renderSehirRehberi();
}
async function sehirMekanYayin(id, ac) {
  const { error } = await sb.from('sehir_rehberi').update({ yayinda: ac }).eq('id', id);
  if (error) { toast('❌ ' + error.message, 'error'); return; }
  const x = SR.liste.find(y => y.id === id); if (x) x.yayinda = ac; sehirCiz();
}
async function sehirTopluYayin(ac) {
  if (!confirm(`${SR.sehir} şehrindeki tüm mekanlar ${ac ? 'yayınlansın' : 'taslağa alınsın'} mı?`)) return;
  const { error } = await sb.from('sehir_rehberi').update({ yayinda: ac }).eq('sehir', SR.sehir);
  if (error) { toast('❌ ' + error.message, 'error'); return; }
  SR.liste.forEach(x => { if (x.sehir === SR.sehir) x.yayinda = ac; }); toast('✅ Güncellendi', 'success'); sehirCiz();
}
async function sehirMekanSil(id) {
  if (!confirm('Mekan silinsin mi?')) return;
  const { error } = await sb.from('sehir_rehberi').delete().eq('id', id);
  if (error) { toast('❌ ' + error.message, 'error'); return; }
  SR.liste = SR.liste.filter(x => x.id !== id); toast('✅ Silindi', 'success'); sehirCiz();
}

// ── YORUMLAR (yolculardan WhatsApp vb. ile gelen mesajlar; sitede "Misafirlerimiz Ne Diyor?" bölümünde) ──
const YORUM_KATEGORI = { umre: 'Umre', hac: 'Hac', kultur: 'Kültür turu', genel: 'Genel' };
// Sitede görünen isim: soyadının ilk harfi hariç yıldız (veritabanındaki ad_maskele ile aynı kural)
function adMaskele(ad) {
  const t = String(ad || '').trim().replace(/\s+/g, ' ');
  const i = t.lastIndexOf(' ');
  if (i < 0) return t;
  const soy = [...t.slice(i + 1)];
  return t.slice(0, i) + ' ' + soy[0] + '*'.repeat(soy.length - 1);
}

async function renderYorumlar() {
  const el = document.getElementById('sayfa-yorum');
  el.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
  const { data, error } = await sb.from('yorumlar').select('*').order('olusturma', { ascending: false });
  if (error) { el.innerHTML = '<div class="card">❌ ' + esc(error.message) + '</div>'; return; }
  let html = '<div class="header"><h2>💬 Yorumlar</h2><button class="btn btn-gold" onclick="yorumYeni()">➕ Yeni Yorum</button></div>';
  html += '<div class="card" style="font-size:13px;color:#555;line-height:1.6">WhatsApp\'tan gelen teşekkür mesajlarını buraya ekleyin; ana sayfada ve (Umre ise) Umre sayfasında <b>yana kaydırılan tek satırlık bir şerit</b> olarak görünür. ' +
    'Eklemeden önce <b>yolcunun iznini alın</b>. Ad soyadı tam yazabilirsiniz; sitede soyadı gizlenir (ör. “Ayşe K***”), tam isim yalnızca burada görünür. Ekran görüntüsü eklerseniz telefon numarası ve profil fotoğrafı görünmesin.</div>';
  html += '<div class="card"><div class="tur-list">';
  if (!data || !data.length) html += '<p style="color:#666;font-size:14px">Henüz yorum yok. “Yeni Yorum” ile ekleyin.</p>';
  html += (data || []).map(y => `
    <div class="tur-item yorum-item">
      <div class="tur-item-info" style="min-width:0;flex:1">
        <h4>${esc(y.ad)}${y.tur ? ' · <span style="font-weight:400">' + esc(y.tur) + '</span>' : ''} ${y.gorsel ? '📷' : ''}</h4>
        <p>Sitede: <b class="ad-gorunen">${esc(y.ad_gorunen || adMaskele(y.ad))}</b></p>
        <p>${YORUM_KATEGORI[y.kategori] || 'Genel'}${y.tarih ? ' · ' + kafileTarih(y.tarih) : ''}</p>
        <p style="margin-top:4px;color:#444;font-style:italic;white-space:pre-line;overflow-wrap:anywhere">${esc(String(y.metin).length > 220 ? String(y.metin).slice(0, 219) + '…' : y.metin)}</p>
      </div>
      <div class="tur-item-actions" style="flex-wrap:wrap">
        <span class="badge ${y.yayinda ? 'badge-green' : 'badge-red'}">${y.yayinda ? 'Yayında' : 'Gizli'}</span>
        <button class="btn btn-navy" onclick="yorumDuzenle(${y.id})">Düzenle</button>
        <button class="btn btn-gold" onclick="yorumYayin(${y.id}, ${!y.yayinda})">${y.yayinda ? 'Gizle' : 'Yayınla'}</button>
        <button class="btn btn-red" onclick="yorumSil(${y.id})">Sil</button>
      </div>
    </div>`).join('');
  html += '</div></div>';
  el.innerHTML = html;
}

          <div id="y_kategoriNot" style="font-size:11.5px;color:#888;margin-top:4px">“Umre” olanlar Umre sayfasında da görünür.</div></div>
        <div class="form-group"><label>Mesaj tarihi (isteğe bağlı)</label><input id="y_tarih" type="date" value="${esc(y.tarih)}"></div>
      </div>
      <div class="form-group"><label>Mesaj (WhatsApp'tan kopyalayıp yapıştırın)</label><textarea id="y_metin" rows="6" maxlength="3000">${esc(y.metin)}</textarea></div>
      <div class="form-group"><label>Fotoğraf / ekran görüntüsü (isteğe bağlı)</label>
        <input type="hidden" id="y_gorsel" value="${esc(y.gorsel || '')}">
        <div id="y_gorselOnizleme" style="margin-bottom:8px">${y.gorsel ? `<img src="${esc(y.gorsel)}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;display:block">` : '<div style="color:#999;font-size:13px">Henüz fotoğraf yok</div>'}</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label class="btn btn-navy" style="cursor:pointer;margin:0">📷 Fotoğraf Seç<input type="file" accept="image/*" style="display:none" onchange="gorselYukle(this,'y')"></label>
          <button type="button" class="btn btn-red" style="padding:8px 12px" onclick="gorselKaldir('y')">Kaldır</button>
          <span id="y_gorselDurum" style="font-size:12px;color:#666"></span>
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0"><input type="checkbox" id="y_izin" ${y.izin ? 'checked' : ''}> <b>Yolcudan sitede yayınlama izni alındı</b></label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0 14px"><input type="checkbox" id="y_yayinda" ${y.yayinda !== false ? 'checked' : ''}> Sitede yayınla</label>
      <div style="display:flex;gap:10px">
        <button class="btn btn-gold" onclick="yorumKaydet(${yeni ? 'null' : y.id})">💾 Kaydet</button>
        <button class="btn btn-navy" onclick="renderYorumlar()">İptal</button>
      </div>
    </div>`;
  const sec = document.getElementById('y_tur_sec');
  if (sec && sec.value) yorumTurSec(sec, true); // düzenlemede listeden seçilmiş tur varsa kategori kilitli açılır
  window.scrollTo(0, 0);
}

async function yorumTurlari() {
  const { data } = await sb.from('turlar').select('id,baslik,kategori,tarih,aktif').order('tarih', { ascending: false });
  return data || [];
}

function yorumTurSec(sel, ilkAcilis) {
  const o = sel.options[sel.selectedIndex], kat = document.getElementById('y_kategori'), not_ = document.getElementById('y_kategoriNot');
  if (!o || !o.value) { kat.disabled = false; if (not_) not_.textContent = '“Umre” olanlar Umre sayfasında da görünür.'; return; }
  if (!ilkAcilis) document.getElementById('y_tur').value = o.getAttribute('data-baslik');
  kat.value = o.getAttribute('data-kategori'); kat.disabled = true; // listeden seçilen turun kategorisi değiştirilemez
  if (not_) not_.textContent = 'Kategori seçilen turdan geliyor. Değiştirmek için tur seçimini kaldırın.';
}

async function yorumYeni() { yorumFormu({ kategori: 'umre', yayinda: true }, await yorumTurlari()); }

async function yorumDuzenle(id) {
  const [{ data, error }, turlar] = await Promise.all([sb.from('yorumlar').select('*').eq('id', id).single(), yorumTurlari()]);
  if (error || !data) { toast('❌ Yorum okunamadı', 'error'); return; }
  yorumFormu(data, turlar);
}

async function yorumKaydet(id) {
  const d = (x) => document.getElementById(x).value.trim();
  const sec = document.getElementById('y_tur_sec');
  const y = { ad: d('y_ad'), tur: d('y_tur') || null, tur_id: (sec && sec.value) || null, kategori: d('y_kategori'), tarih: d('y_tarih') || null, metin: d('y_metin'),
              gorsel: d('y_gorsel') || null, izin: document.getElementById('y_izin').checked, yayinda: document.getElementById('y_yayinda').checked };
  if (!y.ad) { toast('❌ İsim gerekli', 'error'); return; }
  if (!y.metin) { toast('❌ Mesaj boş olamaz', 'error'); return; }
  if (!y.izin) { toast('❌ Yolcunun izni alınmadan yorum eklenemez', 'error'); return; }
  const { error } = id ? await sb.from('yorumlar').update(y).eq('id', id) : await sb.from('yorumlar').insert(y);
  if (error) { toast('❌ ' + error.message, 'error'); return; }
  toast('✅ Yorum kaydedildi', 'success');
  renderYorumlar();
}

async function yorumYayin(id, yayinda) {
  const { error } = await sb.from('yorumlar').update({ yayinda }).eq('id', id);
  if (error) { toast('❌ ' + error.message, 'error'); return; }
  toast(yayinda ? '✅ Yayınlandı' : '✅ Gizlendi', 'success');
  renderYorumlar();
}

async function yorumSil(id) {
  if (!confirm('Yorum silinsin mi?')) return;
  const { error } = await sb.from('yorumlar').delete().eq('id', id);
  if (error) { toast('❌ ' + error.message, 'error'); return; }
  toast('✅ Silindi', 'success');
  renderYorumlar();
}

// ── TOAST ──
// ── BAŞVURULAR ──
const DURUMLAR = {yeni:'🆕 Yeni', arandi:'📞 Arandı', kayit:'✅ Kayıt Oldu', iptal:'✖️ İlgilenmiyor'};
const DURUM_RENK = {yeni:'#dc3545', arandi:'#C9972B', kayit:'#2e7d32', iptal:'#999'};
const FORM_AD = {'umre-kayit':'Umre Kayıt', 'hac-kayit':'Hac Kayıt', 'tur-kayit':'Tur Kayıt', 'iletisim-formu':'İletişim Formu', 'ana-sayfa-iletisim':'Ana Sayfa Formu'};
let basvuruFiltre = 'hepsi';

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function yeniSayacGuncelle() {
  const { count } = await sb.from('basvurular').select('id', { count: 'exact', head: true }).eq('durum', 'yeni');
  const el = document.getElementById('yeniSayac');
  if (count) { el.textContent = count; el.style.display = 'inline-block'; } else el.style.display = 'none';
  const mr = document.getElementById('mobilSayac'); if (mr) { mr.textContent = count || ''; mr.hidden = !count; }
}

async function renderBasvurular() {
  const el = document.getElementById('sayfa-basvuru');
  el.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
  let q = sb.from('basvurular').select('*').order('created_at', { ascending: false }).limit(200);
  if (basvuruFiltre !== 'hepsi') q = q.eq('durum', basvuruFiltre);
  const { data, error } = await q;
  yeniSayacGuncelle();
  if (error) { el.innerHTML = '<div class="loading">❌ ' + esc(error.message) + '</div>'; return; }
  const filtreler = [['hepsi','Tümü'], ...Object.entries(DURUMLAR)];
  el.innerHTML = `
    <div class="header"><h2>📥 Başvurular</h2><button class="btn btn-navy" onclick="renderBasvurular()">↻ Yenile</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${filtreler.map(([k,v]) => `<button class="btn ${basvuruFiltre===k?'btn-navy':''}" style="${basvuruFiltre===k?'':'background:#fff;border:1px solid #ddd;color:#333'}" onclick="basvuruFiltre='${k}';renderBasvurular()">${v}</button>`).join('')}
    </div>
    ${!data.length ? '<div class="card" style="text-align:center;color:#888">Bu listede başvuru yok.</div>' : data.map(b => {
      const tel = (b.telefon||'').replace(/[^0-9+]/g,'');
      const wa = tel.replace(/^\+/,'').replace(/^0/,'90');
      const tarih = new Date(b.created_at).toLocaleString('tr-TR', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
      const ekstra = Object.entries(b.veri||{}).filter(([k]) => !['form-name','program','paket','tur','adsoyad','ad-soyad','ad','soyad','telefon','eposta','hizmet','kisi-sayisi','kisi','mesaj'].includes(k) && b.veri[k]);
      return `<div class="card" style="border-left:4px solid ${DURUM_RENK[b.durum]||'#ccc'}">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
          <div>
            <div style="font-size:12px;color:#888;margin-bottom:4px">${esc(tarih)} · ${esc(FORM_AD[b.form]||b.form||'Form')}</div>
            <div style="font-size:17px;font-weight:700;color:#0B1F3A">${esc(b.ad_soyad||'(isim yok)')}</div>
            ${b.program?`<div style="font-size:13.5px;color:#C9972B;font-weight:600;margin-top:2px">${esc(b.program)}</div>`:''}
          </div>
          <select onchange="basvuruDurum(${b.id}, this.value)" style="padding:7px 10px;border:1.5px solid #ddd;border-radius:6px;font-size:13px">
            ${Object.entries(DURUMLAR).map(([k,v]) => `<option value="${k}" ${b.durum===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:14px">
          ${tel?`<a href="tel:${esc(tel)}" style="color:#0B1F3A;font-weight:600;text-decoration:none">📞 ${esc(b.telefon)}</a><a href="https://wa.me/${esc(wa)}" target="_blank" style="color:#25D366;font-weight:600;text-decoration:none">💬 WhatsApp</a>`:''}
          ${b.eposta?`<a href="mailto:${esc(b.eposta)}" style="color:#0B1F3A;text-decoration:none">✉️ ${esc(b.eposta)}</a>`:''}
          ${b.hizmet?`<span>🏷 ${esc(b.hizmet)}</span>`:''}
          ${b.kisi_sayisi?`<span>👥 ${esc(b.kisi_sayisi)}${/^\d+$/.test(b.kisi_sayisi)?' kişi':''}</span>`:''}
          ${ekstra.map(([k,v]) => `<span>• ${esc(({'tercih-tarih':'Tercih edilen tarih','kvkk_onay':'KVKK onayı'})[k]||k)}: ${esc(v)}</span>`).join('')}
        </div>
        ${b.mesaj?`<div style="margin-top:12px;padding:10px 12px;background:#f7f7f7;border-radius:8px;font-size:13.5px;white-space:pre-wrap">${esc(b.mesaj)}</div>`:''}
        <div style="margin-top:12px;text-align:right"><button class="btn btn-red" style="padding:6px 12px;font-size:12px" onclick="basvuruSil(${b.id})">Sil</button></div>
      </div>`;
    }).join('')}`;
}

async function basvuruDurum(id, durum) {
  const { error } = await sb.from('basvurular').update({ durum }).eq('id', id);
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Durum güncellendi', 'success');
  renderBasvurular();
}

async function basvuruSil(id) {
  if (!confirm('Bu başvuruyu kalıcı olarak silmek istediğinizden emin misiniz?')) return;
  const { error } = await sb.from('basvurular').delete().eq('id', id);
  if (error) { toast('❌ Hata: ' + error.message, 'error'); return; }
  toast('✅ Başvuru silindi', 'success');
  renderBasvurular();
}

// ── TUR FOTOĞRAFI ──
function gorselKucult(dosya, maxW) {
  return new Promise((ok, hata) => {
    const img = new Image();
    img.onload = () => {
      const oran = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * oran); c.height = Math.round(img.height * oran);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : hata(new Error('Görsel işlenemedi')), 'image/jpeg', 0.82);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => hata(new Error('Bu dosya açılamadı'));
    img.src = URL.createObjectURL(dosya);
  });
}

async function gorselYukle(input, p) {
  const dosya = input.files && input.files[0];
  if (!dosya) return;
  const durum = document.getElementById(p + '_gorselDurum');
  durum.textContent = '⏳ Yükleniyor...';
  try {
    const blob = await gorselKucult(dosya, p === 'y' ? 1000 : 1600);
    const yol = (p === 'y' ? 'yorum-' : 'tur-') + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.jpg';
    const { error } = await sb.storage.from('tur-gorselleri').upload(yol, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
    if (error) throw error;
    const url = sb.storage.from('tur-gorselleri').getPublicUrl(yol).data.publicUrl;
    document.getElementById(p + '_gorsel').value = url;
    document.getElementById(p + '_gorselOnizleme').innerHTML = p === 'y' ? `<img src="${url}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;display:block">` : `<img src="${url}" style="width:100%;max-width:360px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block">`;
    durum.textContent = '✅ Yüklendi – kaydetmeyi unutmayın';
  } catch (e) {
    durum.textContent = '❌ ' + (e.message || 'Yükleme başarısız');
  }
  input.value = '';
}

function gorselKaldir(p) {
  document.getElementById(p + '_gorsel').value = '';
  document.getElementById(p + '_gorselOnizleme').innerHTML = '<div style="color:#999;font-size:13px">Henüz fotoğraf yok</div>';
  document.getElementById(p + '_gorselDurum').textContent = 'Kaydettiğinizde fotoğraf kaldırılır';
}

function toast(msg, tip) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast toast-' + tip; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
