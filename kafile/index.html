<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Misafir Uygulaması – İsmail Coşar Turizm</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy2:#132d52;--navy3:#1f3a63;--gold:#C9972B;--goldl:#E4B84A;--goldp:#F5E6C0;--altin-yazi:#6b5413;--krem:#FAF7F0;--beyaz:#fff;--yazi:#0B1F3A;--yazi2:#3a4a62;--soluk:#5d6b82;--cizgi:#ece6d6;--kirmizi:#a3341f;--ff-b:'Playfair Display',Georgia,serif;--ff:'DM Sans',system-ui,-apple-system,sans-serif}
html,body{background:var(--navy)}
body{font-family:var(--ff);color:var(--yazi);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:#8A6516}
.kap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--krem);position:relative}
[hidden]{display:none!important}

/* GİRİŞ */
.giris{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:calc(64px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.giris-logo{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.giris-ikon{width:84px;height:84px;border-radius:24px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--goldl)}
.giris h1{font-family:var(--ff-b);font-size:30px;font-weight:700;line-height:1.15}
.ust-etiket{font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--goldl);font-weight:600}
.giris form{margin-top:56px;display:flex;flex-direction:column;gap:12px}
.giris label{font-size:15px;font-weight:600}
.giris input{height:56px;border-radius:14px;border:1.5px solid #3a5480;background:var(--navy2);color:#fff;font-size:18px;font-family:var(--ff);letter-spacing:1px;padding:0 18px;outline:none;text-transform:uppercase;width:100%}
.giris input:focus{border-color:var(--gold)}
.giris input::placeholder{color:#8a97ad;text-transform:none;letter-spacing:0}
.giris .aciklama{font-size:15px;line-height:1.55;color:#b9c3d4}
.giris .hata{font-size:14px;line-height:1.5;color:#ffd2c8;background:rgba(163,52,31,.35);border:1px solid rgba(255,140,120,.4);border-radius:12px;padding:10px 14px}
.btn-altin{margin-top:10px;height:56px;border-radius:14px;background:var(--gold);color:var(--navy);font-weight:700;font-size:17px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-altin:disabled{opacity:.6}
.giris-alt{margin-top:auto;padding-top:40px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;font-size:14px;color:#b9c3d4}
.giris-alt a{color:var(--goldl);font-weight:600;text-decoration:none}
.giris-alt .cizgi{width:100%;height:1px;background:var(--navy3)}

/* ÜST BAŞLIK */
.bas{background:var(--navy);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 22px 22px;display:flex;flex-direction:column;gap:6px}
.marka{align-self:flex-start;background:#fff;border-radius:10px;padding:4px 10px;margin-bottom:8px;line-height:0}.marka img{height:34px;width:auto;display:block}
.giris-marka{background:#fff;border-radius:14px;padding:8px 16px;line-height:0}.giris-marka img{height:60px;width:auto;display:block}
.adim{background:#fff;border-radius:18px;border:1px solid var(--cizgi);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.adim-no{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--goldl);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.adim-no.tamam{background:#2e7d32;color:#fff}
.adim h3{font-size:16.5px;margin:4px 0 4px;color:var(--navy)}
.adim p{font-size:15px;line-height:1.5;color:var(--soluk);margin:0}
.adim .btn-dolu{margin-top:10px;width:100%;font-size:15.5px;min-height:50px;border:0;font-family:inherit;cursor:pointer}
.bas-ust{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bas-etiket{font-size:13.5px;letter-spacing:2px;font-weight:700;color:var(--goldl);text-transform:uppercase}
.bas h1{font-family:var(--ff-b);font-size:30px;font-weight:700;line-height:1.15}
.bas-alt{font-size:14px;color:#c3cbd9}
.zil{width:44px;height:44px;border-radius:12px;background:var(--navy2);border:0;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.zil .nokta{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--goldl)}
.secim{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--navy2);padding:5px;border-radius:14px;margin-top:8px}
.secim button{height:44px;border:0;border-radius:10px;background:transparent;color:#fff;font-size:15px;font-weight:600}
.secim button[aria-pressed="true"]{background:var(--gold);color:var(--navy);font-weight:700}

/* İÇERİK */
.icerik{padding:16px 16px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.kart{background:#fff;border-radius:18px;border:1px solid var(--cizgi);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.kart-etiket{font-size:13px;letter-spacing:1.5px;font-weight:700;color:var(--altin-yazi);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kart-etiket span:last-child{letter-spacing:0;font-weight:600}
.buyuk-saat{font-family:var(--ff-b);font-size:34px;font-weight:700;line-height:1}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn-cizgi,.btn-dolu{min-height:46px;border-radius:12px;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:0 10px;text-align:center}
.btn-cizgi{border:1.5px solid var(--navy);color:var(--navy);background:#fff}
.btn-dolu{background:var(--navy);color:#fff;border:0}
.altin-kart{background:var(--goldp);border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;color:var(--yazi);text-decoration:none;border:0;text-align:left;width:100%;font-size:inherit}
.sehir-sec{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.sehir-sec button{flex:none;height:42px;padding:0 16px;border-radius:21px;border:1.5px solid var(--cizgi);background:#fff;color:var(--navy);font-size:15px;font-weight:600}
.sehir-sec button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.mekan{background:#fff;border:1px solid var(--cizgi);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mekan b{font-size:16.5px;color:var(--navy)}
.mekan p{font-size:14.5px;color:var(--yazi2);line-height:1.5;margin:0}
.mekan .ikili{margin-top:4px}
.mekan .ikili a,.mekan .ikili button{min-height:44px;font-size:14px}
.paylas-perde{position:fixed;inset:0;z-index:90;background:rgba(11,31,58,.6);display:flex;align-items:flex-end;justify-content:center}
.paylas-kutu{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.paylas-kutu h3{font-size:18px;color:var(--navy);margin:0}
.paylas-kutu .btn-dolu,.paylas-kutu .btn-cizgi,.paylas-kutu label{min-height:52px;font-size:16px;cursor:pointer}
.paylas-kutu img{width:100%;border-radius:12px;display:block}
#paylasOnizleme{display:flex;flex-direction:column}
.bolum-baslik{font-family:var(--ff-b);font-size:20px;font-weight:700;margin-top:6px}
.baslik-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.baslik-satir .bolum-baslik{margin:0}
.anket-soru{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0}
.anket-soru > span{font-size:16px;font-weight:600}
.yildizlar{display:flex;gap:2px}
.yildiz{border:0;background:none;font-size:32px;line-height:1;padding:4px 3px;min-width:40px;min-height:44px;color:#cfc6b0;cursor:pointer;font-family:inherit}
.yildiz.dolu{color:#C9972B}
.anket-yorum{width:100%;border:1.5px solid #e0d6bd;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;min-height:70px;resize:vertical;background:#fff;color:var(--yazi)}
.btn-kucuk{border:1.5px solid var(--gold);background:#fff;color:var(--navy);border-radius:50px;padding:8px 14px;font-size:14px;font-weight:700;min-height:40px;white-space:nowrap;cursor:pointer}
.zaman-cizelge{display:flex;flex-direction:column}
.zc-satir{display:grid;grid-template-columns:52px 18px 1fr;align-items:start;column-gap:10px;padding:8px 8px 12px;border-radius:12px}
.zc-satir .saat{font-weight:600;font-size:14px;padding-top:1px}
.zc-satir .top{width:12px;height:12px;border-radius:50%;border:2px solid var(--navy);margin-top:4px}
.zc-satir.gecti{color:var(--soluk)}
.zc-satir.gecti .top{background:#c3cbd9;border-color:#c3cbd9}
.zc-satir.gecti .ad{text-decoration:line-through}
.zc-satir.simdi{background:#fff}
.zc-satir.simdi .top{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--goldp)}
.zc-satir.simdi .saat,.zc-satir.simdi .ad{font-weight:700}
.zc-satir .ad{font-size:14.5px}
.zc-satir .alt{font-size:14.5px;color:var(--yazi2);margin-top:2px}
.zc-satir .alt a{font-weight:600}
details.tum{background:#fff;border:1px solid var(--cizgi);border-radius:16px;padding:4px 14px}
details.tum summary{min-height:46px;display:flex;align-items:center;font-weight:700;cursor:pointer;list-style:none}
details.tum summary::-webkit-details-marker{display:none}
details.tum summary::after{content:'▾';margin-left:auto;color:var(--soluk)}
details.tum[open] summary::after{content:'▴'}
.gun-baslik{font-size:13.5px;font-weight:700;letter-spacing:1.5px;color:var(--soluk);margin:10px 0 4px;text-transform:uppercase}
.bos{font-size:14.5px;color:var(--yazi2);line-height:1.55}
.uyari-serit{background:#fff4e0;border:1px solid #f0d9a8;color:#6b5413;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.45}
.yukle-kart{background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.yukle-kart p{font-size:15px;line-height:1.45;flex:1}
.yukle-kart button{height:40px;border-radius:10px;border:0;background:var(--gold);color:var(--navy);font-weight:700;padding:0 14px;flex:none}
.yukle-kart .kapat{background:transparent;color:#c3cbd9;padding:0 6px;font-size:20px}

/* DUYURU */
.duyuru{background:#fff;border:1px solid var(--cizgi);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.duyuru.onemli{border:1.5px solid var(--gold)}
.duyuru .ust{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--soluk)}
.duyuru .ust b{color:var(--yazi);font-size:15px}
.duyuru .metin{font-size:14.5px;line-height:1.55;color:var(--yazi2);white-space:pre-wrap;overflow-wrap:anywhere}
.duyuru .yazan{font-size:14px;color:var(--soluk)}
.sabit{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;letter-spacing:1.2px;color:var(--altin-yazi)}

/* SAYAÇ */
.halka{position:relative;width:184px;height:184px;align-self:center}
.halka .ortada{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.halka .sayi{font-family:var(--ff-b);font-size:58px;font-weight:700;line-height:1}
.ipucu{font-size:14px;line-height:1.5;color:var(--yazi2);text-align:center;min-height:42px}
.btn-sayac{width:100%;height:64px;border:0;border-radius:16px;background:var(--navy);color:#fff;font-size:18px;font-weight:700}
.btn-sayac:disabled{opacity:.5}
.btn-ince{height:46px;border-radius:12px;border:1.5px solid #c9c1ad;background:#fff;font-size:14.5px;font-weight:600}
.liste{background:#fff;border:1px solid var(--cizgi);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.liste label,.liste a{min-height:50px;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0ebde;font-size:15px;text-decoration:none;color:var(--yazi);cursor:pointer}
.liste label:last-child,.liste a:last-child{border-bottom:0}
.liste input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none}
.liste input:checked+span{color:var(--soluk);text-decoration:line-through}
.liste .ok{margin-left:auto;color:#8a97ad}
.liste .numara{margin-left:auto;font-size:14px;color:var(--altin-yazi);font-weight:600;white-space:nowrap}

/* VAKİTLER */
.vakit-satir{min-height:46px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0ebde;font-size:16px}
.vakit-satir:last-of-type{border-bottom:0}
.vakit-satir.siradaki{font-weight:700;color:var(--altin-yazi)}
.vakit-satir span:last-child{font-weight:600}
.kible{background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:18px}
.kible .pusula{width:110px;height:110px;flex:none}
.kible .pusula svg{transition:transform .15s linear}
.kible-yazi{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.kible-yazi .etiket{font-size:13px;letter-spacing:1.5px;font-weight:700;color:var(--goldl)}
.kible-yazi button{align-self:flex-start;height:42px;border-radius:10px;border:0;background:var(--gold);color:var(--navy);font-weight:700;padding:0 14px}

/* ACİL */
.btn-acil{min-height:72px;border-radius:18px;background:var(--kirmizi);color:#fff;text-decoration:none;display:flex;align-items:center;gap:14px;padding:12px 20px;border:0;width:100%;text-align:left}
.btn-acil b{font-size:19px;display:block}
.btn-acil small{font-size:15px;color:#f6d9d3}
.btn-konum{min-height:60px;border-radius:16px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);display:flex;align-items:center;gap:14px;padding:10px 20px;font-size:16.5px;font-weight:700;width:100%;text-align:left}
.otel-karti{background:#fff;border:1px dashed #b8ad92;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.otel-karti .ad{font-size:18px;font-weight:700}
.otel-karti .adres{font-size:14px;color:var(--yazi2);line-height:1.5}
.otel-karti .yerel{font-size:19px;line-height:1.6;text-align:start}
.kucuk-not{font-size:14px;color:var(--soluk);line-height:1.5}
.cikis{background:none;border:0;color:var(--soluk);font-size:15px;text-decoration:underline;align-self:center;padding:10px;min-height:44px}

/* ALT MENÜ */
.alt-menu{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid #e6e0cf;padding:6px 4px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;margin:0 auto}
.alt-menu button{background:none;border:0;min-height:56px;font-size:13.5px;font-weight:500;color:var(--soluk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.alt-menu button[aria-current="page"]{color:var(--navy);font-weight:700}
.alt-menu button.acil{color:var(--kirmizi);font-weight:600}
.alt-menu .nokta{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--gold)}
.bildirim{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
</style>
</head>

  // ── Tur sonu memnuniyet anketi (isimsiz; dönüş gününden itibaren Bugün ekranında) ──
  var ANKET_SORU = [['rehber', 'Rehberimiz'], ['otel', 'Oteller'], ['genel', 'Genel memnuniyet']];
  var anket = null; // doldurulurken: { rehber, otel, genel, yorum, gonderiliyor }
  function anketCihaz() { var c = oku('kafile-cihaz', ''); if (!c) { c = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); yaz('kafile-cihaz', c); } return c; }
  function anketKarti() {

      h += '</div></div>';
    });
    h += '<textarea class="anket-yorum" id="anketYorum" maxlength="1000" placeholder="Eklemek istediğiniz bir şey var mı? (isteğe bağlı)">' + esc(anket.yorum) + '</textarea>' +

  function anketYenile() { var k = $('anketKart'); if (k) k.outerHTML = anketKarti(); }
  function anketPuan(soru, puan) { var y = $('anketYorum'); if (y) anket.yorum = y.value; anket[soru] = puan; anketYenile(); }
  function anketGonder() {
    var y = $('anketYorum'); if (y) anket.yorum = y.value;
    if (!anket.rehber || !anket.otel || !anket.genel) { bildir('Lütfen üç soruya da yıldız verin.'); return; }
    anket.gonderiliyor = true; anketYenile();
    var g = { rehber: anket.rehber, otel: anket.otel, genel: anket.genel, yorum: anket.yorum };
    rpc('anket_gonder', { p_kod: S.kod, p_cihaz: anketCihaz(), p_rehber: g.rehber, p_otel: g.otel, p_genel: g.genel, p_yorum: g.yorum }).then(function (ok) {
      if (ok !== true) throw new Error('kabul edilmedi');

  // ── Programı paylaş: o günü ya da tüm programı yazı olarak (geçenler ✅) ──
  function programGunu() { // Bugün sayfasında gösterilen gün: bugün, bugün yoksa sıradaki program günü
    var prog = programListesi(), bugun = simdi().tarih;
    if (prog.some(function (p) { return p.tarih === bugun; })) return bugun;
    var ileri = prog.filter(function (p) { return p.tarih && gunSayisi(bugun, p.tarih) > 0; });
    return ileri.length ? ileri[0].tarih : null;
  }
  function programMetni(kapsam) {
    var v = S.veri, prog = programListesi(), n = simdi(), bugun = n.tarih;
    var gecti = function (p) { if (!p.tarih) return false; var f = gunSayisi(bugun, p.tarih); if (f < 0) return true; if (f > 0) return false; var dk = saatDk(p.saat); return dk != null && dk < n.dk - 5; };
    var satir = function (p) { return (gecti(p) ? '✅ ' : '▫️ ') + (p.saat ? p.saat + ' ' : '') + p.baslik + (p.yer ? ' (Buluşma: ' + p.yer + ')' : ''); };
    var gunBasligi = function (g) { var no = (g && v.baslangic) ? (gunSayisi(v.baslangic, g) + 1) + '. Gün · ' : ''; return no + (g ? tarihYaz(g, true) : 'Tarihsiz'); };
    var s = [];
    if (kapsam === 'gun') {
      var g = programGunu(), liste = prog.filter(function (p) { return p.tarih === g; });
      s.push('*' + v.ad + '*', '📅 ' + (g === bugun ? 'Bugün · ' : '') + gunBasligi(g), '');
      liste.forEach(function (p) { s.push(satir(p)); });
    } else {
      var gunler = [], gr = {};
      prog.forEach(function (p) { var k = p.tarih || ''; if (!gr[k]) { gr[k] = []; gunler.push(k); } gr[k].push(p); });
      s.push('*' + v.ad + ' – Program*');
      gunler.forEach(function (g) {
        var hepsi = gr[g].every(gecti);
        s.push('', (hepsi ? '✅ ' : g === bugun ? '📍 ' : '') + '*' + gunBasligi(g) + '*' + (g === bugun ? ' (bugün)' : ''));
        gr[g].forEach(function (p) { s.push(satir(p)); });
      });
    }
    s.push('', '✅ tamamlandı · ▫️ sırada', 'İsmail Coşar Turizm · ' + SITE);
    return s.join('\n');
  }
  function programPaylasAc() {

  function zamanCizelgesi(liste, simdiDk) {
    var aktifVerildi = false;

  function kisalt(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function duyuruZamani(iso) {

  var VALIZ = [

    else if (ey === 'gecmis-temizle') { if (!confirm('Tavaf ve sa\'y geçmişiniz bu telefondan silinsin mi?')) return; S.gecmis = []; yaz('kafile-gecmis', S.gecmis); ciz(); }
    else if (ey === 'sehir-mekke' || ey === 'sehir-medine') { S.sehir = ey.slice(6); yaz('kafile-sehir', S.sehir); ciz(); }
    else if (ey === 'kible') kibleBaslat();
    else if (ey === 'konum-vakit') konumVakitAl();
    else if (ey === 'bildirim-ac') bildirimAc();
    else if (ey === 'bildirim-kapat') bildirimKapat();
    else if (ey === 'konum-gonder') konumGonder();
    else if (ey === 'cikis') kafiledenCik();
    else if (ey === 'rehber-sehir') { S.rehberSehir = t.getAttribute('data-sehir'); ciz(); }
    else if (ey === 'mekan-paylas') { var mk = mekanBul(t.getAttribute('data-id')); if (mk) paylasimAc(mk); }
    else if (ey === 'foto-gonder') fotoGonder();
    else if (ey === 'hazir-gorsel') { var mh = mekanBul(t.getAttribute('data-id')); if (mh) fotoPaylas(mh, null); }
    else if (ey === 'paylas-kapat') paylasimKapat();
    else if (ey === 'program-paylas') programPaylasAc();
    else if (ey === 'anket-puan') anketPuan(t.getAttribute('data-soru'), Number(t.getAttribute('data-puan')));
    else if (ey === 'anket-gonder') anketGonder();
    else if (ey === 'anket-duzelt') anketDuzelt();
    else if (ey === 'program-gonder') programGonder(t.getAttribute('data-kapsam'));
    else if (ey === 'karsilama-bitti') { S.karsilama = false; yaz('kafile-karsilandi-' + S.kod, true); S.sekme = 'bugun'; ciz(); window.scrollTo(0, 0); }
    else if (ey === 'ios-kapat') { S.iosIpucu = false; yaz('kafile-ios-kapat', true); ciz(); }
    else if (ey === 'yukle' && S.yukleIstemi) { S.yukleIstemi.prompt(); S.yukleIstemi.userChoice.finally(function () { S.yukleIstemi = null; ciz(); }); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.classList && e.target.classList.contains('paylas-dosya')) { var mf = mekanBul(e.target.getAttribute('data-id')), df = e.target.files && e.target.files[0]; if (mf && df) fotoPaylas(mf, df); return; }
    var x = e.target.getAttribute && e.target.getAttribute('data-valiz');
    if (x == null) return;
    if (e.target.checked) S.valiz[x] = 1; else delete S.valiz[x];
    yaz('kafile-valiz', S.valiz); ciz();
  });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.yukleIstemi = e; if (S.sekme === 'bugun' || S.karsilama) ciz(); });
  window.addEventListener('appinstalled', function () { S.yukleIstemi = null; ciz(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.kod) { yenile(true); konumOtoYenile(); } });
  window.addEventListener('online', function () { if (S.kod) yenile(true); });
  setInterval(function () { if (document.visibilityState === 'visible' && S.veri && (S.sekme === 'bugun' || S.sekme === 'vakitler')) ciz(); }, 30000);
  setInterval(function () { if (document.visibilityState === 'visible' && S.kod) yenile(true); }, 120000);

  // ── açılış ──
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    swKayit = navigator.serviceWorker.register('sw.js').catch(function () { return null; });
    navigator.serviceWorker.addEventListener('message', function (e) { // bildirime dokunulunca açık uygulamada Duyurular'a geç
      if (e.data && e.data.tur === 'sekme' && S.veri) { S.sekme = e.data.sekme; ciz(); yenile(true); }
    });
  }
  try { // bildirimden açılış: ?sekme=duyurular
    var ilkSekme = new URLSearchParams(location.search).get('sekme');
    if (ilkSekme && /^(bugun|duyurular|rehber|vakitler|acil)$/.test(ilkSekme)) { S.sekme = ilkSekme; history.replaceState(null, '', location.pathname + location.hash); }
  } catch (e) {}
  function normalAcilis() {
    if (!S.kod) { girisGoster(); return; }
    var kayit = oku('kafile-veri-' + S.kod, null);
    if (kayit && kayit.veri) { S.veri = kayit.veri; S.guncelleme = kayit.zaman; uygulamaGoster(); yenile(true); }
    else { $('kodKutu').value = S.kod; girisGoster(); }
  }
  // Paylaşılan bağlantı: .../kafile/#KOD → kodla otomatik giriş
  var hashKod = '';
  try { hashKod = decodeURIComponent((location.hash || '').slice(1)).toLocaleUpperCase('en').replace(/\s+/g, ''); } catch (e) {}
  if (/^[A-Z0-9-]{4,40}$/.test(hashKod)) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (hashKod === S.kod) normalAcilis();
    else { $('kodKutu').value = hashKod; girisGoster(); if ($('girisForm').requestSubmit) $('girisForm').requestSubmit(); else $('girisBtn').click(); }
  } else normalAcilis();
})();
</script>
