*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy2:#132d52;--navy3:#1f3a63;--gold:#C9972B;--goldl:#E4B84A;--goldp:#F5E6C0;--altin-yazi:#6b5413;--krem:#FAF7F0;--beyaz:#fff;--yazi:#0B1F3A;--yazi2:#3a4a62;--soluk:#5d6b82;--cizgi:#ece6d6;--kirmizi:#a3341f;--ff-b:'Playfair Display',Georgia,serif;--ff:'DM Sans',system-ui,-apple-system,sans-serif}
html,body{background:var(--navy)}
body{font-family:var(--ff);color:var(--yazi);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:#8A6516}
.kap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--krem);position:relative}

/* GİRİŞ */

.giris h1{font-family:var(--ff-b);font-size:30px;font-weight:700;line-height:1.15}
.ust-etiket{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--goldl);font-weight:600}
.giris form{margin-top:56px;display:flex;flex-direction:column;gap:12px}
.giris label{font-size:15px;font-weight:600}
.giris input{height:56px;border-radius:14px;border:1.5px solid #3a5480;background:var(--navy2);color:#fff;font-size:18px;font-family:var(--ff);letter-spacing:1px;padding:0 18px;outline:none;text-transform:uppercase;width:100%}
.giris input:focus{border-color:var(--gold)}
.giris input::placeholder{color:#8a97ad;text-transform:none;letter-spacing:0}
.giris .aciklama{font-size:13.5px;line-height:1.55;color:#b9c3d4}
.giris .hata{font-size:14px;line-height:1.5;color:#ffd2c8;background:rgba(163,52,31,.35);border:1px solid rgba(255,140,120,.4);border-radius:12px;padding:10px 14px}
.btn-altin{margin-top:10px;height:56px;border-radius:14px;background:var(--gold);color:var(--navy);font-weight:700;font-size:17px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-altin:disabled{opacity:.6}
.giris-alt{margin-top:auto;padding-top:40px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;font-size:14px;color:#b9c3d4}
.giris-alt a{color:var(--goldl);font-weight:600;text-decoration:none}
.giris-alt .cizgi{width:100%;height:1px;background:var(--navy3)}

.bas-ust{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bas-etiket{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--goldl);text-transform:uppercase}
.bas h1{font-family:var(--ff-b);font-size:30px;font-weight:700;line-height:1.15}
.bas-alt{font-size:14px;color:#c3cbd9}
.zil{width:44px;height:44px;border-radius:12px;background:var(--navy2);border:0;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.zil .nokta{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--goldl)}
.secim{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--navy2);padding:5px;border-radius:14px;margin-top:8px}
.secim button{height:44px;border:0;border-radius:10px;background:transparent;color:#fff;font-size:15px;font-weight:600}
.secim button[aria-pressed="true"]{background:var(--gold);color:var(--navy);font-weight:700}

/* İÇERİK */

.kart-etiket{font-size:11.5px;letter-spacing:1.5px;font-weight:700;color:var(--altin-yazi);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kart-etiket span:last-child{letter-spacing:0;font-weight:600}
.buyuk-saat{font-family:var(--ff-b);font-size:34px;font-weight:700;line-height:1}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn-cizgi,.btn-dolu{min-height:46px;border-radius:12px;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:0 10px;text-align:center}

.duyuru.onemli{border:1.5px solid var(--gold)}

.btn-sayac{width:100%;height:64px;border:0;border-radius:16px;background:var(--navy);color:#fff;font-size:18px;font-weight:700}
.btn-sayac:disabled{opacity:.5}
.btn-ince{height:46px;border-radius:12px;border:1.5px solid #c9c1ad;background:#fff;font-size:14.5px;font-weight:600}
.liste{background:#fff;border:1px solid var(--cizgi);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.liste label,.liste a{min-height:50px;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0ebde;font-size:15px;text-decoration:none;color:var(--yazi);cursor:pointer}
.liste label:last-child,.liste a:last-child{border-bottom:0}
.liste input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none}
.liste input:checked+span{color:var(--soluk);text-decoration:line-through}
.liste .ok{margin-left:auto;color:#8a97ad}
.liste .numara{margin-left:auto;font-size:14px;color:var(--altin-yazi);font-weight:600;white-space:nowrap}

/* VAKİTLER */
.vakit-satir{min-height:46px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0ebde;font-size:16px}
.vakit-satir:last-of-type{border-bottom:0}
.vakit-satir.siradaki{font-weight:700;color:var(--altin-yazi)}
.vakit-satir span:last-child{font-weight:600}
.kible{background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:18px}
.kible .pusula{width:110px;height:110px;flex:none}
.kible .pusula svg{transition:transform .15s linear}
.kible-yazi{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.kible-yazi .etiket{font-size:11.5px;letter-spacing:1.5px;font-weight:700;color:var(--goldl)}
.kible-yazi button{align-self:flex-start;height:42px;border-radius:10px;border:0;background:var(--gold);color:var(--navy);font-weight:700;padding:0 14px}

/* ACİL */
.btn-acil{min-height:72px;border-radius:18px;background:var(--kirmizi);color:#fff;text-decoration:none;display:flex;align-items:center;gap:14px;padding:12px 20px;border:0;width:100%;text-align:left}
.btn-acil b{font-size:19px;display:block}
.btn-acil small{font-size:13.5px;color:#f6d9d3}
.btn-konum{min-height:60px;border-radius:16px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);display:flex;align-items:center;gap:14px;padding:10px 20px;font-size:16.5px;font-weight:700;width:100%;text-align:left}
.otel-karti{background:#fff;border:1px dashed #b8ad92;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.otel-karti .ad{font-size:18px;font-weight:700}

.kucuk-not{font-size:12px;color:var(--soluk);line-height:1.5}
.cikis{background:none;border:0;color:var(--soluk);font-size:13.5px;text-decoration:underline;align-self:center;padding:10px;min-height:44px}

/* ALT MENÜ */
.alt-menu{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid #e6e0cf;padding:6px 4px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;margin:0 auto}
.alt-menu button{background:none;border:0;min-height:56px;font-size:11.5px;font-weight:500;color:var(--soluk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.alt-menu button[aria-current="page"]{color:var(--navy);font-weight:700}
.alt-menu button.acil{color:var(--kirmizi);font-weight:600}
.alt-menu .nokta{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--gold)}
.bildirim{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
</style>
</head>

  setInterval(function () { if (document.visibilityState === 'visible' && S.veri && (S.sekme === 'bugun' || S.sekme === 'vakitler')) ciz(); }, 30000);

    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (hashKod === S.kod) normalAcilis();
    else { $('kodKutu').value = hashKod; girisGoster(); if ($('girisForm').requestSubmit) $('girisForm').requestSubmit(); else $('girisBtn').click(); }
  } else normalAcilis();
