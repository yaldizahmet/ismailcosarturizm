<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teşekkürler – İsmail Coşar Turizm</title>
<meta http-equiv="refresh" content="5;url=index.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--gold:#C9972B;--gold-light:#E4B84A;--cream:#FAF7F0;--ff-head:'Playfair Display',Georgia,serif;--ff-body:'DM Sans',sans-serif}
body{font-family:var(--ff-body);background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--cream);border-radius:24px;padding:56px 48px;text-align:center;max-width:500px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.icon{font-size:72px;margin-bottom:24px;animation:popIn .6s cubic-bezier(.22,1,.36,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
h1{font-family:var(--ff-head);font-size:32px;font-weight:700;color:var(--navy);margin-bottom:12px}
h1 em{font-style:normal;color:var(--gold)}
p{font-size:15px;color:#6b7a94;line-height:1.7;margin-bottom:8px}
.redirect-note{font-size:12.5px;color:#aaa;margin-top:20px}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.btn-gold{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--navy);font-size:15px;font-weight:700;padding:13px 24px;border-radius:10px;text-decoration:none;transition:background .2s}
.btn-gold:hover{background:var(--gold-light)}
.btn-wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;font-size:15px;font-weight:700;padding:13px 24px;border-radius:10px;text-decoration:none;transition:background .2s}
.btn-wa:hover{background:#20bb5a}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Mesajınız <em>Alındı!</em></h1>
  <p>Formunuz başarıyla iletildi. En geç <strong>1 iş günü</strong> içinde sizi arayacağız.</p>
  <p>Acil konular için aşağıdaki kanallardan bize ulaşabilirsiniz.</p>
  <div class="actions">
    <a href="https://wa.me/905331980781?text=Merhaba%2C%20form%20doldurdum%2C%20bilgi%20almak%20istiyorum." class="btn-wa" target="_blank">💬 WhatsApp'tan Yazın</a>
    <a href="tel:+905331980781" class="btn-gold">📞 0533 198 07 81</a>
  </div>
  <p class="redirect-note">5 saniye içinde ana sayfaya yönlendirileceksiniz...</p>
</div>
</body>
</html>
